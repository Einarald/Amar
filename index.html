<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Einar vs Amar: Remastered</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FFB300;
            --accent: #FF6D00;
            --bg-dark: #1a1a2e;
            --font-main: 'Fredoka One', cursive;
            --font-ui: 'Nunito', sans-serif;
        }

        body { 
            margin: 0; overflow: hidden; 
            background-color: var(--bg-dark); 
            font-family: var(--font-ui); 
            user-select: none; -webkit-user-select: none; touch-action: none;
            color: white;
        }

        #game-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }

        /* UI LAYOUT */
        .ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex; flex-direction: column;
            z-index: 10; transition: opacity 0.3s ease;
        }
        
        .interactive { pointer-events: auto !important; }
        .hidden { opacity: 0 !important; pointer-events: none !important; visibility: hidden; }

        /* SCREENS */
        .screen {
            background: rgba(15, 15, 25, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            align-items: center; justify-content: center;
            text-align: center;
        }

        /* TEXTURE VIEWER */
        .screen-clear {
            background: transparent;
            align-items: center; justify-content: space-between;
            text-align: center;
        }

        h1 {
            font-family: var(--font-main);
            font-size: 48px; color: var(--primary);
            text-transform: uppercase; letter-spacing: 2px;
            text-shadow: 4px 4px 0px #000;
            margin: 0 0 10px 0; transform: rotate(-3deg);
            pointer-events: none;
        }

        /* MENU LAYOUT */
        .menu-content {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            width: 100%; height: 100%;
            pointer-events: none;
        }

        .card-container {
            display: flex; gap: 15px; overflow-x: auto; padding: 20px 10px;
            width: 100%; justify-content: center; box-sizing: border-box;
            pointer-events: auto;
            margin-bottom: 20px;
            max-width: 95vw;
        }

        .card {
            background: linear-gradient(145deg, #2a2a3e, #20202e);
            border-radius: 20px; padding: 15px; min-width: 100px;
            border: 3px solid transparent; transition: 0.2s;
            cursor: pointer; display: flex; flex-direction: column; align-items: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            position: relative;
        }
        .card.selected { border-color: var(--primary); transform: translateY(-5px); background: #33334d; }
        .card-icon { font-size: 30px; margin-bottom: 5px; }

        /* BUTTONS */
        .btn-container {
            display: flex; flex-direction: column; align-items: center; gap: 15px;
            pointer-events: auto;
            z-index: 100;
        }

        .btn-row { display: flex; gap: 15px; }

        .btn {
            background: linear-gradient(to bottom, #FFD54F, #FFB300);
            border: none; border-radius: 50px;
            padding: 15px 50px; font-family: var(--font-main); font-size: 24px;
            color: #5d4037; cursor: pointer;
            box-shadow: 0 6px 0 #bf360c, 0 10px 20px rgba(0,0,0,0.4);
            transition: transform 0.1s; text-transform: uppercase;
            touch-action: manipulation;
        }
        .btn:active { transform: translateY(6px); box-shadow: 0 0 0 #bf360c; }
        .btn-small { padding: 10px 25px; font-size: 16px; }
        .btn-shop { background: linear-gradient(to bottom, #42A5F5, #1E88E5); color: white; box-shadow: 0 6px 0 #0D47A1; }
        .btn-tex { background: linear-gradient(to bottom, #E91E63, #C2185B); color: white; box-shadow: 0 6px 0 #880E4F; }

        /* HUD */
        #hud { 
            padding: 20px; box-sizing: border-box;
            display: flex; justify-content: space-between; align-items: flex-start;
        }
        
        .stat-badge {
            background: rgba(0,0,0,0.6); border-radius: 30px;
            padding: 8px 16px; display: flex; align-items: center; gap: 8px;
            font-family: var(--font-main); font-size: 20px;
            border: 2px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(4px);
            white-space: nowrap; height: 40px;
        }
        .heart-icon { color: #ff5252; filter: drop-shadow(0 0 5px #ff5252); }

        #hud-center {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            font-family: var(--font-main); font-size: 32px;
            color: white; text-shadow: 0 4px 0 rgba(0,0,0,0.5);
            background: rgba(0,0,0,0.3); padding: 5px 20px; border-radius: 20px;
        }
        
        #zone-warning {
            position: absolute; top: 100px; width: 100%; text-align: center; left: 0;
            font-family: var(--font-main); color: #ff5252; font-size: 24px;
            text-shadow: 2px 2px 0 #000; opacity: 0; transition: opacity 0.5s;
        }

        /* CONTROLS */
        #controls { 
            top: auto !important; bottom: 30px; left: 0; width: 100%; height: 150px; 
            pointer-events: none; 
        }
        #joystick-area {
            position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
            width: 140px; height: 140px; pointer-events: auto;
        }
        @media (hover: hover) and (pointer: fine) { #joystick-area { opacity: 0.3; } }

        #stick-bg {
            width: 100%; height: 100%; border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(5px);
        }
        #stick-thumb {
            width: 60px; height: 60px; border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #fff, #ccc);
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        #ability-btn {
            position: absolute; bottom: 20px; right: 30px;
            width: 90px; height: 90px; border-radius: 50%;
            background: linear-gradient(135deg, #ff4081, #c51162);
            border: 4px solid rgba(255,255,255,0.3);
            display: flex; justify-content: center; align-items: center;
            pointer-events: auto; box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            transition: transform 0.1s;
        }
        #ability-btn:active { transform: scale(0.9); }
        #ability-btn i { font-size: 30px; font-weight: bold; font-style: normal; }
        
        /* SHOP */
        .shop-grid { display: grid; grid-template-columns: 1fr; gap: 10px; width: 90%; max-width: 500px; max-height: 50vh; overflow-y: auto; }
        .shop-row { 
            background: rgba(255,255,255,0.05); padding: 10px 20px; border-radius: 15px; 
            display: flex; justify-content: space-between; align-items: center; text-align: left;
        }
        .shop-row h3 { margin: 0; color: var(--primary); font-family: var(--font-main); }

        /* TEXTURES MENU */
        #tex-viewer {
            display: flex; flex-direction: column; align-items: center;
            width: 100%; height: 100%; pointer-events: none;
            justify-content: space-between; padding: 40px 0; box-sizing: border-box;
        }
        .tex-controls {
            pointer-events: auto; display: flex; align-items: center; gap: 20px;
            z-index: 20;
        }
        .tex-info {
            background: rgba(0,0,0,0.7); padding: 20px; border-radius: 20px;
            max-width: 400px; margin-bottom: 20px; pointer-events: auto;
        }
        .tex-info h2 { margin: 0 0 10px 0; color: var(--primary); }
        .tex-info p { margin: 0; color: #ddd; font-size: 18px; line-height: 1.4; }
        
        #tex-touch-area {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 5; pointer-events: auto; cursor: grab;
        }
        #tex-back-btn { pointer-events: auto; margin-bottom: 20px; z-index: 20; }

        #loader { background: #111; z-index: 100; color: var(--primary); font-family: var(--font-main); font-size: 24px; }

    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="game-canvas"></div>

    <!-- LOADER -->
    <div id="loader" class="ui-layer screen">
        <div>LOADING...</div>
    </div>

    <!-- MAIN MENU -->
    <div id="menu" class="ui-layer screen interactive">
        <div class="menu-content">
            <h1>Einar<br><span style="color:white; font-size:30px;">vs</span><br>Amar</h1>
            <div style="margin-bottom: 10px; color: #aaa;">Survival Runner</div>
            
            <div class="card-container" id="map-select">
                <!-- JS Populated -->
            </div>
            
            <div class="btn-container">
                <button class="btn" onclick="Game.start()">PLAY</button>
                <div class="btn-row">
                    <button class="btn btn-small btn-shop" onclick="UI.toShop()">SHOP</button>
                    <button class="btn btn-small btn-tex" onclick="UI.toTextures()">SKINS</button>
                </div>
            </div>
        </div>
    </div>

    <!-- SHOP -->
    <div id="shop" class="ui-layer screen interactive hidden">
        <h2>SHOP</h2>
        <div style="display:flex; gap:20px; margin-bottom:20px;">
            <div class="stat-badge"><span style="color:#FFD700">●</span> <span id="shop-coins">0</span></div>
            <div class="stat-badge"><span style="color:#00FFFF">♦</span> <span id="shop-gems">0</span></div>
        </div>
        <div class="shop-grid" id="shop-list"></div>
        <button class="btn btn-small" onclick="UI.toMenu()" style="margin-top:20px;">BACK</button>
    </div>

    <!-- TEXTURES / SHOWCASE -->
    <div id="textures" class="ui-layer screen-clear hidden">
        <div id="tex-touch-area"></div> 
        
        <div id="tex-viewer">
            <div class="tex-controls">
                <button class="btn btn-small" onclick="Game.switchTexture(-1)">&#9664;</button>
                <h2 id="tex-name" style="margin:0; min-width:150px; text-shadow:2px 2px 5px black;">Einar</h2>
                <button class="btn btn-small" onclick="Game.switchTexture(1)">&#9654;</button>
            </div>
            <div style="display:flex; flex-direction:column; align-items:center; gap:10px; z-index:20; width:100%;">
                <div class="tex-info">
                    <h2 id="tex-title">Einar</h2>
                    <p id="tex-desc">Description...</p>
                </div>
                <button id="tex-back-btn" class="btn btn-small" onclick="UI.toMenu()">BACK</button>
            </div>
        </div>
    </div>

    <!-- HUD -->
    <div id="hud" class="ui-layer hidden">
        <div style="display:flex; gap:10px;">
            <div class="stat-badge"><span class="heart-icon">♥</span> <span id="hud-hp">3</span></div>
        </div>
        <div id="hud-center">00:00</div>
        <div style="display:flex; gap:10px;">
            <div class="stat-badge"><span style="color:#FFD700">●</span> <span id="hud-coins">0</span></div>
            <div class="stat-badge" style="background:rgba(255,0,0,0.3); border-color:red"><span style="color:white">⚠</span> <span id="hud-timer">30</span></div>
        </div>
    </div>
    
    <div id="zone-warning" class="ui-layer">ZONE SHRINKING!</div>

    <!-- Controls -->
    <div id="controls" class="ui-layer hidden">
        <div id="joystick-area">
            <div id="stick-bg"></div>
            <div id="stick-thumb"></div>
        </div>
        <div id="ability-btn" class="interactive">
            <i>⚡</i>
        </div>
    </div>

    <!-- GAME OVER -->
    <div id="gameover" class="ui-layer screen interactive hidden">
        <h1 style="color:#ff5252">EATEN!</h1>
        <h2 id="final-score" style="margin:0; color:white;">00:00</h2>
        <p>Rewards:</p>
        <div style="display:flex; gap:15px; justify-content:center; margin-bottom:20px;">
            <div class="stat-badge">+<span id="end-coins">0</span> ●</div>
            <div class="stat-badge">+<span id="end-gems">0</span> ♦</div>
        </div>
        <button class="btn" onclick="Game.toMenu()">MENU</button>
    </div>

<script>
const AudioSys = {
    ctx: null,
    init() { if(!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
    playTone(freq, type, dur, vol=0.1, slide=0) {
        if(!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        if(slide) osc.frequency.exponentialRampToValueAtTime(slide, this.ctx.currentTime + dur);
        gain.gain.setValueAtTime(vol, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + dur);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime + dur);
    },
    sfx: {
        coin: () => { AudioSys.playTone(1200, 'sine', 0.1, 0.1); setTimeout(()=>AudioSys.playTone(1800, 'sine', 0.2, 0.1), 50); },
        dash: () => AudioSys.playTone(300, 'sawtooth', 0.3, 0.1, 50),
        hit: () => AudioSys.playTone(100, 'square', 0.3, 0.2, 10),
        step: () => AudioSys.playTone(80, 'triangle', 0.05, 0.02)
    }
};

const Assets = {
    materials: {
        skin: new THREE.MeshToonMaterial({color: 0xffccaa}),
        shirt: new THREE.MeshToonMaterial({color: 0x2196F3}), 
        pants: new THREE.MeshToonMaterial({color: 0x333333}),
        dogMain: new THREE.MeshToonMaterial({color: 0xE65100}), 
        dogWhite: new THREE.MeshToonMaterial({color: 0xFFFFFF}),
        tree: new THREE.MeshToonMaterial({color: 0x4CAF50}),
        wood: new THREE.MeshToonMaterial({color: 0x5D4037}),
        coin: new THREE.MeshToonMaterial({color: 0xFFD700, emissive: 0x332200}),
        gem: new THREE.MeshToonMaterial({color: 0x00FFFF, emissive: 0x004444}),
        miloGrey: new THREE.MeshToonMaterial({color: 0x757575}),
        miloLight: new THREE.MeshToonMaterial({color: 0xcccccc}),
        hair: new THREE.MeshToonMaterial({color: 0x5D4037}),
        eyeWhite: new THREE.MeshBasicMaterial({color: 0xFFFFFF}),
        eyeBlack: new THREE.MeshBasicMaterial({color: 0x000000})
    },
    
    createPlayer() {
        const group = new THREE.Group();
        const torso = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.2, 0.5), this.materials.shirt);
        torso.position.y = 1.4; torso.castShadow = true; group.add(torso);
        const headGroup = new THREE.Group(); headGroup.position.y = 2.3;
        const head = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.7, 0.7), this.materials.skin);
        headGroup.add(head);
        const hair = new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.25, 0.75), this.materials.hair);
        hair.position.y = 0.38; headGroup.add(hair);
        const fringe = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.15, 0.1), this.materials.hair);
        fringe.position.set(0, 0.25, 0.35); headGroup.add(fringe);
        const createEye = (x) => {
            const eyeGroup = new THREE.Group(); eyeGroup.position.set(x, 0.05, 0.36);
            const white = new THREE.Mesh(new THREE.PlaneGeometry(0.15, 0.15), this.materials.eyeWhite);
            const pupil = new THREE.Mesh(new THREE.PlaneGeometry(0.08, 0.08), this.materials.eyeBlack);
            pupil.position.z = 0.01; eyeGroup.add(white, pupil); return eyeGroup;
        };
        headGroup.add(createEye(0.18), createEye(-0.18));
        group.add(headGroup);
        const backpack = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.8, 0.3), new THREE.MeshToonMaterial({color: 0x555555}));
        backpack.position.set(0, 1.5, -0.35); group.add(backpack);
        const createLimb = (mat, x, y) => {
            const pivot = new THREE.Group(); pivot.position.set(x, y, 0);
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(0.3, 1, 0.3), mat);
            mesh.position.y = -0.4; mesh.castShadow = true; pivot.add(mesh); return pivot;
        };
        const legL = createLimb(this.materials.pants, -0.25, 0.8);
        const legR = createLimb(this.materials.pants, 0.25, 0.8);
        const armL = createLimb(this.materials.skin, -0.55, 1.9);
        const armR = createLimb(this.materials.skin, 0.55, 1.9);
        group.add(legL, legR, armL, armR);
        const shadow = new THREE.Mesh(new THREE.CircleGeometry(0.8, 16), new THREE.MeshBasicMaterial({color:0x000000, opacity:0.3, transparent:true}));
        shadow.rotation.x = -Math.PI/2; shadow.position.y = 0.05; group.add(shadow);
        return { mesh: group, limbs: { legL, legR, armL, armR } };
    },

    createAmar() {
        const group = new THREE.Group();
        const body = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.7, 1.4), this.materials.dogMain);
        body.position.y = 0.8; body.castShadow = true; group.add(body);
        const chest = new THREE.Mesh(new THREE.BoxGeometry(0.72, 0.5, 0.6), this.materials.dogWhite);
        chest.position.set(0, 0.7, 0.45); group.add(chest);
        const headGroup = new THREE.Group(); headGroup.position.set(0, 1.3, 0.6);
        headGroup.add(new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.6), this.materials.dogMain));
        const snout = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.25, 0.3), this.materials.dogWhite);
        snout.position.set(0, -0.1, 0.4); headGroup.add(snout);
        const earGeo = new THREE.ConeGeometry(0.1, 0.3, 4);
        const earL = new THREE.Mesh(earGeo, this.materials.dogMain); earL.position.set(0.15, 0.4, 0);
        const earR = earL.clone(); earR.position.set(-0.15, 0.4, 0); headGroup.add(earL, earR);
        headGroup.add(earL, earR);

        // Eyes for Amar
        const eyeGeo = new THREE.SphereGeometry(0.05, 8, 8);
        const eyeL_Mesh = new THREE.Mesh(eyeGeo, this.materials.eyeBlack);
        eyeL_Mesh.position.set(0.15, 0.1, 0.32);
        const eyeR_Mesh = eyeL_Mesh.clone();
        eyeR_Mesh.position.set(-0.15, 0.1, 0.32);
        headGroup.add(eyeL_Mesh, eyeR_Mesh);

        group.add(headGroup);
        const tail = new THREE.Mesh(new THREE.TorusGeometry(0.15, 0.05, 4, 8, 3), this.materials.dogWhite);
        tail.position.set(0, 1.0, -0.7); tail.rotation.set(Math.PI/2, 0, -0.5); group.add(tail);
        const createDogLeg = (x, z) => {
            const pivot = new THREE.Group(); pivot.position.set(x, 0.7, z);
            const leg = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.7, 0.2), this.materials.dogMain);
            leg.position.y = -0.35; pivot.add(leg); return pivot;
        };
        const limbs = [createDogLeg(0.2, 0.5), createDogLeg(-0.2, 0.5), createDogLeg(0.2, -0.5), createDogLeg(-0.2, -0.5)];
        limbs.forEach(l => group.add(l));
        return { mesh: group, head: headGroup, limbs };
    },

    createMilo() {
        const group = new THREE.Group();
        const grey = this.materials.miloGrey; const light = this.materials.miloLight;
        const body = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 1.2), grey);
        body.position.y = 0.7; body.castShadow = true; group.add(body);
        const headGroup = new THREE.Group(); headGroup.position.set(0, 1.1, 0.5);
        headGroup.add(new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.45, 0.5), grey));
        const snout = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.25, 0.25), light);
        snout.position.set(0, -0.05, 0.35); headGroup.add(snout);
        const beard = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.2, 0.1), light);
        beard.position.set(0, -0.25, 0.35); headGroup.add(beard);
        const earL = new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.2, 4), grey);
        earL.position.set(0.15, 0.35, 0); earL.rotation.z = -0.2;
        const earR = earL.clone(); earR.position.set(-0.15, 0.35, 0); earR.rotation.z = 0.2;
        headGroup.add(earL, earR); 

        // Eyes for Milo
        const eyeGeo = new THREE.SphereGeometry(0.04, 8, 8);
        const eyeL_Mesh = new THREE.Mesh(eyeGeo, this.materials.eyeBlack);
        eyeL_Mesh.position.set(0.12, 0.15, 0.38);
        const eyeR_Mesh = eyeL_Mesh.clone();
        eyeR_Mesh.position.set(-0.12, 0.15, 0.38);
        headGroup.add(eyeL_Mesh, eyeR_Mesh);

        group.add(headGroup);
        const tail = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.3), grey);
        tail.position.set(0, 0.9, -0.6); tail.rotation.x = Math.PI/4; group.add(tail);
        const createDogLeg = (x, z) => {
            const pivot = new THREE.Group(); pivot.position.set(x, 0.6, z);
            const leg = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.6, 0.18), grey);
            leg.position.y = -0.3; pivot.add(leg); return pivot;
        };
        const limbs = [createDogLeg(0.2, 0.4), createDogLeg(-0.2, 0.4), createDogLeg(0.2, -0.4), createDogLeg(-0.2, -0.4)];
        limbs.forEach(l => group.add(l));
        return { mesh: group, head: headGroup, limbs };
    },

    createTree() {
        const group = new THREE.Group();
        const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.6, 1.5, 5), this.materials.wood);
        trunk.position.y = 0.75; trunk.castShadow = true; group.add(trunk);
        const leaves1 = new THREE.Mesh(new THREE.ConeGeometry(2, 2.5, 6), this.materials.tree);
        leaves1.position.y = 2; leaves1.castShadow = true; group.add(leaves1);
        const leaves2 = new THREE.Mesh(new THREE.ConeGeometry(1.5, 2, 6), this.materials.tree);
        leaves2.position.y = 3.2; group.add(leaves2);
        return group;
    }
};

const Game = {
    state: 'init',
    maps: {
        forest: { name: "Forest", color: 0x4CAF50, bg: 0x81C784, friction: 0.8 },
        desert: { name: "Desert", color: 0xFFB74D, bg: 0xFFE0B2, friction: 0.8 },
        ice: { name: "Arctic", color: 0xB3E5FC, bg: 0xE1F5FE, friction: 0.89 },
        studio: { name: "Studio", color: 0x424242, bg: 0x616161, friction: 0.8 }
    },
    
    scene: null, camera: null, renderer: null, clock: new THREE.Clock(),
    player: null, enemies: [], coins: [], props: [],
    currentMap: 'forest',
    joystick: { x: 0, y: 0, active: false },
    keys: { w: false, a: false, s: false, d: false },
    zone: { radius: 120, target: 120, mesh: null, time: 30 },
    stats: { coins: 0, gems: 0, time: 0 },
    upgrades: { speed: 0, hp: 0, agility: 0 },
    
    textureIdx: 0, textureModel: null,
    textureData: [
        { name: "Einar", desc: "A brave traveler. His main goal is to survive and collect all coins.", create: () => Assets.createPlayer() },
        { name: "Amar", desc: "Main antagonist. Breed: Basenji. Incredibly fast.", create: () => Assets.createAmar() },
        { name: "Milo", desc: "Amar's loyal partner. Appears rarely but strikes hard.", create: () => Assets.createMilo() }
    ],

    init() {
        const save = localStorage.getItem('einar_save_v2');
        if(save) {
            const d = JSON.parse(save);
            this.stats.coins = d.coins || 0;
            this.stats.gems = d.gems || 0;
            this.upgrades = d.upgrades || {speed:0, hp:0, agility:0};
        }
        this.scene = new THREE.Scene();
        this.camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 100);
        this.renderer = new THREE.WebGLRenderer({antialias: true, alpha: false});
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        this.renderer.setPixelRatio(window.devicePixelRatio);
        this.renderer.shadowMap.enabled = true;
        this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        this.renderer.outputEncoding = THREE.sRGBEncoding;
        document.getElementById('game-canvas').appendChild(this.renderer.domElement);

        window.addEventListener('resize', ()=>this.onResize());
        this.setupControls();

        this.loadMenuScene();
        UI.init();
        document.getElementById('loader').classList.add('hidden');
        this.animate();
    },

    // HELPER TO FIX LIGHTING BUG
    addLights(isGame = false) {
        // Balanced lighting to bring back atmosphere without black screen
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.7); // Reduced intensity
        hemiLight.position.set(0, 20, 0);
        this.scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8); // Reduced intensity for better shadows
        dirLight.position.set(10, 30, 20);
        dirLight.castShadow = true;
        
        if(isGame) {
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            dirLight.shadow.camera.left = -60; dirLight.shadow.camera.right = 60;
            dirLight.shadow.camera.top = 60; dirLight.shadow.camera.bottom = -60;
        } else {
            dirLight.shadow.mapSize.width = 1024;
            dirLight.shadow.mapSize.height = 1024;
        }
        this.scene.add(dirLight);

        const amb = new THREE.AmbientLight(0x404040, 0.4); // Subtle ambient
        this.scene.add(amb);
    },

    loadMenuScene() {
        this.clearScene();
        this.addLights(false); 

        this.scene.background = new THREE.Color(0x1a1a2e);
        this.scene.fog = null;
        const menuFloor = new THREE.Mesh(new THREE.PlaneGeometry(50, 50), new THREE.MeshToonMaterial({color: 0x222233}));
        menuFloor.rotation.x = -Math.PI/2; menuFloor.receiveShadow = true; this.scene.add(menuFloor);
        const p = Assets.createPlayer();
        p.mesh.position.set(2, 0, 0); p.mesh.rotation.y = -Math.PI/2; this.scene.add(p.mesh);
        const a = Assets.createAmar();
        a.mesh.position.set(5, 0, 0); a.mesh.rotation.y = -Math.PI/2; this.scene.add(a.mesh);
        this.menuAnim = { player: p, enemy: a, time: 0 };
        this.camera.position.set(0, 3, 8);
        this.camera.lookAt(0, 1.5, 0);
    },

    start() {
        if (document.activeElement) document.activeElement.blur();
        this.state = 'play';
        UI.setScreen('controls');
        UI.showHUD(true);
        AudioSys.init();
        this.clearScene();
        this.addLights(true); 

        this.enemies = []; this.coins = []; this.props = [];
        this.stats.time = 0;
        const map = this.maps[this.currentMap];
        this.scene.background = new THREE.Color(map.bg);
        // Restored FOG but starting closer (40) and fading out (140) to fix "no fog" complaint
        this.scene.fog = new THREE.Fog(map.bg, 40, 140); 
        
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshToonMaterial({color: map.color}));
        ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; this.scene.add(ground);
        
        // Grid made subtle
        const grid = new THREE.GridHelper(400, 100, 0x000000, 0x000000);
        grid.material.opacity = 0.05; grid.material.transparent = true; this.scene.add(grid);
        
        this.zone.radius = 120; this.zone.target = 120; this.zone.time = 30;
        const ringGeo = new THREE.RingGeometry(0.5, 1, 128);
        const ringMat = new THREE.MeshBasicMaterial({color: 0xff0000, transparent: true, opacity: 0.2, side: THREE.DoubleSide});
        this.zone.mesh = new THREE.Mesh(ringGeo, ringMat);
        this.zone.mesh.rotation.x = -Math.PI/2; this.zone.mesh.position.y = 0.1; this.scene.add(this.zone.mesh);
        const pObj = Assets.createPlayer();
        this.player = {
            mesh: pObj.mesh, limbs: pObj.limbs,
            pos: new THREE.Vector3(0,0,0), vel: new THREE.Vector3(0,0,0),
            hp: 3 + this.upgrades.hp, speed: 32 + (this.upgrades.speed * 1.12),
            invuln: 0, dashCd: 0
        };
        this.scene.add(this.player.mesh);
        const propCount = this.currentMap === 'studio' ? 40 : 100;
        for(let i=0; i<propCount; i++) {
            const x = (Math.random()-0.5)*200; const z = (Math.random()-0.5)*200;
            if(Math.hypot(x,z) < 10) continue;
            let mesh;
            if(this.currentMap === 'forest') mesh = Assets.createTree();
            else mesh = new THREE.Mesh(new THREE.DodecahedronGeometry(1 + Math.random()), new THREE.MeshToonMaterial({color:0x777777}));
            mesh.position.set(x, this.currentMap!=='forest'?1:0, z);
            mesh.rotation.y = Math.random() * Math.PI; this.scene.add(mesh);
            this.props.push({mesh, r: 1.5});
        }
        UI.updateHUD();
    },

    spawnEnemy() {
        const angle = Math.random() * Math.PI * 2; const r = 60;
        const x = this.player.pos.x + Math.cos(angle) * r;
        const z = this.player.pos.z + Math.sin(angle) * r;
        const isMilo = Math.random() < 0.3;
        const obj = isMilo ? Assets.createMilo() : Assets.createAmar();
        obj.mesh.position.set(x, 0, z); this.scene.add(obj.mesh);
        this.enemies.push({
            mesh: obj.mesh, head: obj.head, limbs: obj.limbs,
            vel: new THREE.Vector3(), speed: (isMilo?9.5:9.0) + Math.min(this.stats.time/30, 6)
        });
    },

    spawnCoin() {
        const rad = Math.max(20, this.zone.radius * 0.9);
        const angle = Math.random() * Math.PI * 2; const dist = Math.sqrt(Math.random()) * rad;
        const x = Math.cos(angle) * dist; const z = Math.sin(angle) * dist;
        const isGem = Math.random() < 0.1;
        let mesh;
        if (isGem) {
            mesh = new THREE.Mesh(new THREE.ConeGeometry(0.5, 1, 4), Assets.materials.gem);
            mesh.rotation.x = Math.PI;
        } else {
            mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.8, 0.15, 16), Assets.materials.coin);
            mesh.rotation.x = Math.PI/2;
        }
        mesh.position.set(x, 1, z); this.scene.add(mesh);
        this.coins.push({mesh, isGem, active: true});
    },

    loadShowcase(idx) {
        this.state = 'textures';
        this.clearScene();
        this.addLights(false); 

        this.scene.background = new THREE.Color(0x333333); 
        this.scene.fog = null; 
        
        const spot = new THREE.SpotLight(0xffffff, 1.0);
        spot.position.set(5, 10, 5); spot.castShadow = true; this.scene.add(spot);
        
        const floor = new THREE.Mesh(new THREE.CircleGeometry(4, 32), new THREE.MeshToonMaterial({color: 0x555555}));
        floor.rotation.x = -Math.PI/2; floor.receiveShadow = true; this.scene.add(floor);

        const data = this.textureData[idx];
        const obj = data.create();
        this.textureModel = obj.mesh;
        this.textureModel.position.set(0, 0, 0);
        this.scene.add(this.textureModel);

        this.camera.position.set(0, 2.5, 6);
        this.camera.lookAt(0, 1.5, 0);

        document.getElementById('tex-name').innerText = data.name;
        document.getElementById('tex-title').innerText = data.name;
        document.getElementById('tex-desc').innerText = data.desc;
    },

    switchTexture(dir) {
        this.textureIdx += dir;
        if(this.textureIdx < 0) this.textureIdx = this.textureData.length - 1;
        if(this.textureIdx >= this.textureData.length) this.textureIdx = 0;
        this.loadShowcase(this.textureIdx);
    },

    onTextureDrag(dx) {
        if(this.textureModel) this.textureModel.rotation.y += dx * 0.01;
    },

    update(dt) {
        if(this.state === 'textures') { this.scene.fog = null; return; }

        if(this.state === 'menu') {
            this.menuAnim.time += dt * 10;
            const t = this.menuAnim.time;
            const pLimbs = this.menuAnim.player.limbs;
            pLimbs.legL.rotation.x = Math.sin(t) * 0.8; pLimbs.legR.rotation.x = Math.sin(t + Math.PI) * 0.8;
            pLimbs.armL.rotation.x = Math.sin(t + Math.PI) * 0.8; pLimbs.armR.rotation.x = Math.sin(t) * 0.8;
            const eLimbs = this.menuAnim.enemy.limbs;
            eLimbs[0].rotation.x = Math.sin(t) * 0.6; eLimbs[1].rotation.x = Math.sin(t + Math.PI) * 0.6;
            eLimbs[2].rotation.x = Math.sin(t + Math.PI) * 0.6; eLimbs[3].rotation.x = Math.sin(t) * 0.6;
            this.menuAnim.player.mesh.position.y = Math.abs(Math.sin(t)) * 0.1;
            this.menuAnim.enemy.mesh.position.y = Math.abs(Math.sin(t)) * 0.1;
            return;
        }

        if(this.state !== 'play') return;
        this.stats.time += dt;
        const mins = Math.floor(this.stats.time / 60).toString().padStart(2, '0');
        const secs = Math.floor(this.stats.time % 60).toString().padStart(2, '0');
        document.getElementById('hud-center').innerText = `${mins}:${secs}`;

        this.zone.time -= dt;
        if(this.zone.time <= 0) {
            this.zone.target = Math.max(30, this.zone.radius * 0.8);
            this.zone.time = 30;
            document.getElementById('zone-warning').style.opacity = 1;
            setTimeout(()=>document.getElementById('zone-warning').style.opacity=0, 3000);
        }
        this.zone.radius += (this.zone.target - this.zone.radius) * dt * 0.5;
        this.zone.mesh.scale.set(this.zone.radius, this.zone.radius, 1);

        const desiredEnemies = Math.floor(this.stats.time / 10) + 1;
        if(this.enemies.length < desiredEnemies && this.stats.time > 3) this.spawnEnemy();
        if(this.coins.length < 10) this.spawnCoin();

        const p = this.player; const map = this.maps[this.currentMap];
        let moveX = 0; let moveY = 0;
        if(this.joystick.active) { moveX = this.joystick.x; moveY = this.joystick.y; }
        else {
            if(this.keys.w) moveY -= 1; if(this.keys.s) moveY += 1;
            if(this.keys.a) moveX -= 1; if(this.keys.d) moveX += 1;
            if(moveX || moveY) { const len = Math.hypot(moveX, moveY); moveX /= len; moveY /= len; }
        }
        if(moveX || moveY) {
            p.vel.x += moveX * p.speed * 4 * dt; p.vel.z += moveY * p.speed * 4 * dt;
            p.mesh.rotation.y = Math.atan2(moveX, moveY);
        }
        if(p.dashCd > 0) p.dashCd -= dt;
        
        p.pos.add(p.vel.clone().multiplyScalar(dt)); 
        const frictionFactor = Math.pow(map.friction, dt * 60);
        p.vel.multiplyScalar(frictionFactor);
        
        p.mesh.position.copy(p.pos);

        const speed = p.vel.length(); const animTime = this.stats.time * 15;
        if(speed > 0.5) {
            p.limbs.legL.rotation.x = Math.sin(animTime) * 0.8; p.limbs.legR.rotation.x = Math.sin(animTime + Math.PI) * 0.8;
            p.limbs.armL.rotation.x = Math.sin(animTime + Math.PI) * 0.8; p.limbs.armR.rotation.x = Math.sin(animTime) * 0.8;
        } else { p.limbs.legL.rotation.x = 0; p.limbs.legR.rotation.x = 0; }

        if(p.pos.length() > this.zone.radius) { if(Math.random() < 0.1) this.takeDamage(); }
        this.props.forEach(prop => {
            const d = p.pos.distanceTo(prop.mesh.position);
            if(d < prop.r) {
                const push = p.pos.clone().sub(prop.mesh.position).normalize().multiplyScalar(prop.r - d);
                p.pos.add(push); p.mesh.position.copy(p.pos);
            }
        });

        for(let i=this.enemies.length-1; i>=0; i--) {
            const e = this.enemies[i];
            const dir = p.pos.clone().sub(e.mesh.position).normalize();
            this.enemies.forEach(other => {
                if(e === other) return;
                const d = e.mesh.position.distanceTo(other.mesh.position);
                if(d < 1.5) dir.add(e.mesh.position.clone().sub(other.mesh.position).normalize().multiplyScalar(2));
            });
            e.mesh.position.add(dir.multiplyScalar(e.speed * dt));
            e.mesh.lookAt(p.pos);
            e.mesh.position.y = Math.abs(Math.sin(this.stats.time * 10)) * 0.2;
            if(e.limbs) {
                const legSpeed = this.stats.time * 20;
                e.limbs[0].rotation.x = Math.sin(legSpeed) * 0.5; e.limbs[1].rotation.x = Math.sin(legSpeed + Math.PI) * 0.5;
                e.limbs[2].rotation.x = Math.sin(legSpeed + Math.PI) * 0.5; e.limbs[3].rotation.x = Math.sin(legSpeed) * 0.5;
            }
            if(e.mesh.position.distanceTo(p.pos) < 1.0) { this.takeDamage(); e.mesh.position.sub(dir.multiplyScalar(3)); }
        }

        this.coins.forEach((c, idx) => {
            if(!c.active) return;
            c.mesh.rotation.y += dt * 3;
            const dist = p.pos.distanceTo(c.mesh.position);
            if(dist < 5) c.mesh.position.lerp(p.pos, dt * 5);
            if(dist < 1) {
                c.active = false; this.scene.remove(c.mesh); this.coins.splice(idx, 1);
                AudioSys.sfx.coin(); if(c.isGem) this.stats.gems++; else this.stats.coins++;
                UI.updateHUD();
            }
        });

        this.camera.position.x += (p.pos.x - this.camera.position.x) * 3 * dt;
        this.camera.position.z += (p.pos.z + 25 - this.camera.position.z) * 3 * dt;
        this.camera.lookAt(p.pos);
        if(p.invuln > 0) { p.invuln -= dt; p.mesh.visible = Math.floor(this.stats.time * 20) % 2 === 0; }
        else p.mesh.visible = true;
    },

    takeDamage() {
        if(this.player.invuln > 0) return;
        this.player.hp--; this.player.invuln = 1.5; AudioSys.sfx.hit(); UI.updateHUD();
        const shake = 20;
        document.body.style.transform = `translate(${Math.random()*shake-shake/2}px, ${Math.random()*shake-shake/2}px)`;
        setTimeout(()=>document.body.style.transform = 'none', 100);
        if(this.player.hp <= 0) this.gameOver();
    },

    useAbility() {
        if(this.state !== 'play') return;
        const p = this.player;
        if(p.dashCd <= 0) {
            const dir = new THREE.Vector3(0,0,1).applyAxisAngle(new THREE.Vector3(0,1,0), p.mesh.rotation.y);
            p.vel.add(dir.multiplyScalar(30)); p.dashCd = 2.0; AudioSys.sfx.dash();
            const btn = document.getElementById('ability-btn');
            btn.style.opacity = 0.5; setTimeout(()=>btn.style.opacity = 1, 2000);
        }
    },

    gameOver() {
        this.state = 'gameover'; UI.showHUD(false); UI.setScreen('gameover');
        this.stats.coins += this.coins.filter(c=>!c.active).length;
        localStorage.setItem('einar_save_v2', JSON.stringify({ coins: this.stats.coins, gems: this.stats.gems, upgrades: this.upgrades }));
        document.getElementById('end-coins').innerText = this.stats.coins;
        document.getElementById('end-gems').innerText = this.stats.gems;
        const mins = Math.floor(this.stats.time / 60).toString().padStart(2, '0');
        const secs = Math.floor(this.stats.time % 60).toString().padStart(2, '0');
        document.getElementById('final-score').innerText = `${mins}:${secs}`;
        document.getElementById('gameover').classList.remove('hidden');
    },

    animate() {
        requestAnimationFrame(()=>this.animate());
        const dt = Math.min(this.clock.getDelta(), 0.1);
        this.update(dt);
        this.renderer.render(this.scene, this.camera);
    },
    onResize() {
        this.camera.aspect = window.innerWidth/window.innerHeight;
        this.camera.updateProjectionMatrix();
        this.renderer.setSize(window.innerWidth, window.innerHeight);
    },

    setupControls() {
        const stick = document.getElementById('joystick-area');
        const thumb = document.getElementById('stick-thumb');
        const handleTouch = (e) => {
            e.preventDefault(); const touch = e.touches[0];
            const rect = stick.getBoundingClientRect();
            const cx = rect.left + rect.width/2; const cy = rect.top + rect.height/2;
            let dx = touch.clientX - cx; let dy = touch.clientY - cy;
            const dist = Math.min(Math.hypot(dx, dy), 50); const angle = Math.atan2(dy, dx);
            dx = Math.cos(angle) * dist; dy = Math.sin(angle) * dist;
            thumb.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
            this.joystick.x = dx / 50; this.joystick.y = dy / 50; this.joystick.active = true;
        };
        stick.addEventListener('touchstart', handleTouch);
        stick.addEventListener('touchmove', handleTouch);
        stick.addEventListener('touchend', (e) => {
             e.preventDefault(); thumb.style.transform = `translate(-50%, -50%)`;
             this.joystick.x = 0; this.joystick.y = 0; this.joystick.active = false;
        });
        document.getElementById('ability-btn').addEventListener('touchstart', (e)=>{ e.preventDefault(); this.useAbility(); });
        window.addEventListener('keydown', (e) => {
            const k = e.key.toLowerCase();
            if(k === 'w' || k === 'ц') this.keys.w = true; if(k === 'a' || k === 'ф') this.keys.a = true;
            if(k === 's' || k === 'ы') this.keys.s = true; if(k === 'd' || k === 'в') this.keys.d = true;
            if(e.code === 'Space') this.useAbility();
        });
        window.addEventListener('keyup', (e) => {
            const k = e.key.toLowerCase();
            if(k === 'w' || k === 'ц') this.keys.w = false; if(k === 'a' || k === 'ф') this.keys.a = false;
            if(k === 's' || k === 'ы') this.keys.s = false; if(k === 'd' || k === 'в') this.keys.d = false;
        });

        const texArea = document.getElementById('tex-touch-area');
        let isDrag = false; let lastX = 0;
        texArea.addEventListener('mousedown', (e) => { isDrag = true; lastX = e.clientX; });
        texArea.addEventListener('touchstart', (e) => { isDrag = true; lastX = e.touches[0].clientX; });
        window.addEventListener('mousemove', (e) => {
            if(isDrag) { Game.onTextureDrag(e.clientX - lastX); lastX = e.clientX; }
        });
        window.addEventListener('touchmove', (e) => {
            if(isDrag) { Game.onTextureDrag(e.touches[0].clientX - lastX); lastX = e.touches[0].clientX; }
        });
        window.addEventListener('mouseup', () => isDrag = false);
        window.addEventListener('touchend', () => isDrag = false);
    },
    clearScene() { while(this.scene.children.length > 0) this.scene.remove(this.scene.children[0]); },
    toMenu() { this.state = 'menu'; UI.setScreen('menu'); UI.showHUD(false); this.loadMenuScene(); },
};

const UI = {
    init() {
        const mapCont = document.getElementById('map-select');
        mapCont.innerHTML = '';
        Object.keys(Game.maps).forEach(k => {
            const m = Game.maps[k];
            const div = document.createElement('div');
            div.className = `card ${k==='forest'?'selected':''}`;
            div.innerHTML = `<div class="card-icon">${k=='forest'?'🌲':k=='desert'?'🌵':k=='ice'?'❄️':'🏢'}</div><div>${m.name}</div>`;
            div.onclick = () => {
                document.querySelectorAll('.card').forEach(c=>c.classList.remove('selected'));
                div.classList.add('selected');
                Game.currentMap = k;
            };
            mapCont.appendChild(div);
        });
        this.updateShop();
    },
    setScreen(id) {
        document.querySelectorAll('.ui-layer').forEach(el => el.classList.add('hidden'));
        if(id) document.getElementById(id).classList.remove('hidden');
    },
    showHUD(show) {
        const hud = document.getElementById('hud');
        const controls = document.getElementById('controls');
        if(show) { hud.classList.remove('hidden'); controls.classList.remove('hidden'); }
        else { hud.classList.add('hidden'); controls.classList.add('hidden'); }
    },
    updateHUD() {
        if(Game.player) {
            document.getElementById('hud-hp').innerText = Game.player.hp;
            document.getElementById('hud-coins').innerText = Game.stats.coins;
            document.getElementById('hud-timer').innerText = Math.ceil(Game.zone.time);
        }
    },
    toShop() { this.setScreen('shop'); this.updateShop(); },
    toTextures() { UI.setScreen(null); Game.loadShowcase(0); document.getElementById('textures').classList.remove('hidden'); },
    toMenu() { this.setScreen('menu'); Game.toMenu(); },
    updateShop() {
        document.getElementById('shop-coins').innerText = Game.stats.coins;
        document.getElementById('shop-gems').innerText = Game.stats.gems;
        const list = document.getElementById('shop-list'); list.innerHTML = '';
        const upgrades = [
            { id: 'speed', name: 'Speed', desc: 'Run faster', cost: l => 25 * (l+1), curr: 'coins', max: 5 },
            { id: 'hp', name: 'Health', desc: 'More hearts', cost: l => 5 + (l*2), curr: 'gems', max: 3 }
        ];
        upgrades.forEach(u => {
            const lvl = Game.upgrades[u.id]; const cost = u.cost(lvl); const isMax = lvl >= u.max;
            const div = document.createElement('div'); div.className = 'shop-row';
            div.innerHTML = `<div><h3>${u.name} <small>Lvl ${lvl}</small></h3><small>${u.desc}</small></div>
                <button class="btn btn-small" style="padding:5px 15px; font-size:14px;" 
                ${isMax ? 'disabled' : ''} onclick="UI.buy('${u.id}')">${isMax ? 'MAX' : cost + (u.curr=='coins'?'●':'♦')}</button>`;
            list.appendChild(div);
        });
    },
    buy(id) {
        const upg = { speed: {cost: l=>100*(l+1), curr:'coins'}, hp: {cost: l=>5+l*2, curr:'gems'} }[id];
        const lvl = Game.upgrades[id]; const cost = upg.cost(lvl);
        if(Game.stats[upg.curr] >= cost) {
            Game.stats[upg.curr] -= cost; Game.upgrades[id]++; AudioSys.sfx.coin();
            localStorage.setItem('einar_save_v2', JSON.stringify({ coins: Game.stats.coins, gems: Game.stats.gems, upgrades: Game.upgrades }));
            this.updateShop();
        }
    }
};

window.onload = () => Game.init();
</script>
</body>
