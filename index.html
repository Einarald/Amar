<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Einar vs Amar: Island Update</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #FFB300;
            --accent: #FF6D00;
            --bg-dark: #1a1a2e;
            --font-main: 'Fredoka One', cursive;
            --font-ui: 'Nunito', sans-serif;
            --xp-color: #00BFFF;
        }

        body { 
            margin: 0; overflow: hidden; 
            background-color: var(--bg-dark); 
            font-family: var(--font-ui); 
            user-select: none; -webkit-user-select: none; touch-action: none;
            color: white;
        }

        #game-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }

        /* UI LAYOUT */
        .ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex; flex-direction: column;
            z-index: 10; transition: opacity 0.3s ease;
        }
        
        .interactive { pointer-events: auto !important; }
        .hidden { opacity: 0 !important; pointer-events: none !important; visibility: hidden; }

        /* SCREENS */
        .screen {
            background: rgba(15, 15, 25, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            align-items: center; justify-content: center;
            text-align: center;
        }

        /* TEXTURE VIEWER (LABORATORY) */
        .screen-clear {
            background: transparent;
            align-items: center; justify-content: space-between;
            text-align: center;
        }

        /* CUSTOMIZE SCREEN (New Layout) */
        #customize {
            background: transparent; /* No blur/darkness as requested */
            flex-direction: row;
            align-items: stretch;
            justify-content: flex-start;
        }
        
        .cust-left-panel {
            width: 350px;
            max-width: 40%;
            background: rgba(0,0,0,0.8);
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            pointer-events: auto;
            overflow-y: auto;
            border-right: 2px solid var(--primary);
        }

        .cust-right-area {
            flex-grow: 1;
            height: 100%;
            position: relative;
            pointer-events: auto; /* For rotation */
        }

        .cust-tabs {
            display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 15px;
        }
        
        .cust-tab-btn {
            background: #333; border: 1px solid #555; color: #aaa;
            padding: 8px 12px; border-radius: 8px; cursor: pointer;
            font-family: var(--font-main); font-size: 14px;
        }
        .cust-tab-btn.active { background: var(--primary); color: #000; border-color: var(--primary); }

        .color-grid {
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 20px;
        }
        .color-item {
            aspect-ratio: 1; border-radius: 50%; border: 2px solid #555; cursor: pointer;
            position: relative; box-shadow: 0 4px 5px rgba(0,0,0,0.5);
        }
        .color-item.locked::after {
            content: '🔒'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 12px;
        }
        .color-item.selected { border-color: white; transform: scale(1.1); }

        .slots-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: auto;
        }
        .slot-card {
            background: #222; border: 2px solid #444; border-radius: 10px;
            padding: 5px; cursor: pointer; display: flex; flex-direction: column; align-items: center;
        }
        .slot-card.active { border-color: var(--primary); }
        .slot-img { width: 100%; aspect-ratio: 1; background: #111; border-radius: 5px; margin-bottom: 5px; object-fit: cover; }
        .slot-name { font-size: 12px; color: #ccc; width: 100%; border: none; background: transparent; text-align: center; }

        h1 {
            font-family: var(--font-main);
            font-size: 48px; color: var(--primary);
            text-transform: uppercase; letter-spacing: 2px;
            text-shadow: 4px 4px 0px #000;
            margin: 0 0 10px 0; transform: rotate(-3deg);
            pointer-events: none;
            position: relative;
        }

        /* CROWN FOR LVL 100 */
        #master-crown {
            position: absolute; top: -50px; left: 50%; transform: translateX(-50%) rotate(3deg);
            font-size: 50px; filter: drop-shadow(0 0 10px gold);
            display: none; animation: floatCrown 2s infinite ease-in-out;
        }
        @keyframes floatCrown { 0%,100%{transform:translateX(-50%) translateY(0);} 50%{transform:translateX(-50%) translateY(-10px);} }

        /* MENU LAYOUT */
        .menu-content {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            width: 100%; height: 100%;
            pointer-events: none;
        }

        /* MAP SELECTION */
        .card-container {
            display: flex; gap: 15px; overflow-x: auto; padding: 20px 10px;
            width: 100%; justify-content: center; box-sizing: border-box;
            pointer-events: auto;
            margin-bottom: 20px;
            max-width: 95vw;
        }

        .card {
            background: linear-gradient(145deg, #2a2a3e, #20202e);
            border-radius: 20px; padding: 15px; min-width: 100px;
            border: 3px solid transparent; transition: 0.2s;
            cursor: pointer; display: flex; flex-direction: column; align-items: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            position: relative;
            opacity: 1; filter: grayscale(0);
        }
        .card.locked { opacity: 0.6; filter: grayscale(1); cursor: not-allowed; }
        .card.selected { border-color: var(--primary); transform: translateY(-5px); background: #33334d; }
        .card-icon { font-size: 30px; margin-bottom: 5px; }
        .lock-icon { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 40px; color: #ff5252; text-shadow: 0 0 5px black; display: none; }
        .card.locked .lock-icon { display: block; }
        .lvl-req { font-size: 10px; color: #aaa; margin-top: 5px; font-weight: bold; }

        /* BUTTONS */
        .btn-container {
            display: flex; flex-direction: column; align-items: center; gap: 15px;
            pointer-events: auto;
            z-index: 100;
        }

        .btn-row { display: flex; gap: 15px; }

        .btn {
            background: linear-gradient(to bottom, #FFD54F, #FFB300);
            border: none; border-radius: 50px;
            padding: 15px 50px; font-family: var(--font-main); font-size: 24px;
            color: #5d4037; cursor: pointer;
            box-shadow: 0 6px 0 #bf360c, 0 10px 20px rgba(0,0,0,0.4);
            transition: transform 0.1s; text-transform: uppercase;
            touch-action: manipulation;
        }
        .btn:active { transform: translateY(6px); box-shadow: 0 0 0 #bf360c; }
        .btn-small { padding: 10px 25px; font-size: 16px; }
        .btn-shop { background: linear-gradient(to bottom, #42A5F5, #1E88E5); color: white; box-shadow: 0 6px 0 #0D47A1; }
        .btn-tex { background: linear-gradient(to bottom, #E91E63, #C2185B); color: white; box-shadow: 0 6px 0 #880E4F; }

        /* XP & LEVEL UI */
        .xp-container {
            width: 80%; max-width: 400px; background: rgba(0,0,0,0.5);
            border-radius: 20px; padding: 5px; border: 2px solid #555;
            margin: 10px 0; position: relative;
        }
        .xp-bar-fill {
            height: 15px; background: linear-gradient(90deg, #00BFFF, #87CEFA);
            border-radius: 10px; width: 0%; transition: width 1s ease-out;
            box-shadow: 0 0 10px #00BFFF;
        }
        .level-badge {
            display: flex; align-items: center; justify-content: center; gap: 5px;
            font-family: var(--font-main); font-size: 24px; color: white;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        .star-icon { color: var(--xp-color); filter: drop-shadow(0 0 5px var(--xp-color)); font-size: 28px; }

        /* HUD */
        #hud { 
            padding: 20px; box-sizing: border-box;
            display: flex; justify-content: space-between; align-items: flex-start;
        }
        
        .stat-badge {
            background: rgba(0,0,0,0.6); border-radius: 30px;
            padding: 8px 16px; display: flex; align-items: center; gap: 8px;
            font-family: var(--font-main); font-size: 20px;
            border: 2px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(4px);
            white-space: nowrap; height: 40px;
        }
        .heart-icon { color: #ff5252; filter: drop-shadow(0 0 5px #ff5252); }

        #hud-center {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            font-family: var(--font-main); font-size: 32px;
            color: white; text-shadow: 0 4px 0 rgba(0,0,0,0.5);
            background: rgba(0,0,0,0.3); padding: 5px 20px; border-radius: 20px;
        }
        
        #zone-warning {
            position: absolute; top: 100px; width: 100%; text-align: center; left: 0;
            font-family: var(--font-main); color: #ff5252; font-size: 24px;
            text-shadow: 2px 2px 0 #000; opacity: 0; transition: opacity 0.5s;
        }

        /* CONTROLS */
        #controls { 
            top: auto !important; bottom: 30px; left: 0; width: 100%; height: 150px; 
            pointer-events: none; 
        }
        #joystick-area {
            position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
            width: 140px; height: 140px; pointer-events: auto;
        }
        @media (hover: hover) and (pointer: fine) { #joystick-area { opacity: 0.3; } }

        #stick-bg {
            width: 100%; height: 100%; border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(5px);
        }
        #stick-thumb {
            width: 60px; height: 60px; border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #fff, #ccc);
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        #ability-btn {
            position: absolute; bottom: 20px; right: 30px;
            width: 90px; height: 90px; border-radius: 50%;
            background: linear-gradient(135deg, #ff4081, #c51162);
            border: 4px solid rgba(255,255,255,0.3);
            display: flex; justify-content: center; align-items: center;
            pointer-events: auto; box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            transition: transform 0.1s;
        }
        #ability-btn:active { transform: scale(0.9); }
        #ability-btn i { font-size: 30px; font-weight: bold; font-style: normal; }
        
        /* SHOP */
        .shop-grid { display: grid; grid-template-columns: 1fr; gap: 10px; width: 90%; max-width: 500px; max-height: 50vh; overflow-y: auto; }
        .shop-row { 
            background: rgba(255,255,255,0.05); padding: 10px 20px; border-radius: 15px; 
            display: flex; justify-content: space-between; align-items: center; text-align: left;
        }
        .shop-row h3 { margin: 0; color: var(--primary); font-family: var(--font-main); }
        #best-run-display {
            background: rgba(0, 0, 0, 0.4);
            padding: 10px; border-radius: 10px;
            margin-bottom: 10px; font-weight: bold; color: #ffeb3b;
        }

        /* TEXTURES MENU (LAB) UI */
        #tex-viewer {
            display: flex; flex-direction: column; align-items: center;
            width: 100%; height: 100%; pointer-events: none;
            justify-content: space-between; padding: 40px 0; box-sizing: border-box;
        }
        .tex-controls {
            pointer-events: auto; display: flex; align-items: center; gap: 20px;
            z-index: 20;
        }
        .tex-info {
            background: rgba(0,0,0,0.7); padding: 20px; border-radius: 20px;
            max-width: 400px; margin-bottom: 20px; pointer-events: auto;
            border: 1px solid rgba(0, 191, 255, 0.3); /* Tech border */
            box-shadow: 0 0 15px rgba(0, 191, 255, 0.2);
        }
        .tex-info h2 { margin: 0 0 10px 0; color: var(--primary); }
        .tex-info p { margin: 0; color: #ddd; font-size: 18px; line-height: 1.4; }
        
        #tex-touch-area {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 5; pointer-events: auto; cursor: grab;
        }
        /* Fixed sizing for buttons */
        #tex-back-btn, #customize-btn { pointer-events: auto; margin-bottom: 10px; z-index: 20; }
        
        /* Modal */
        #modal {
            position: absolute; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.8); z-index: 200;
            display: flex; justify-content: center; align-items: center;
        }
        .modal-content {
            background: #2a2a3e; padding: 20px; border-radius: 15px; border: 2px solid var(--primary);
            text-align: center; max-width: 80%;
        }

        /* END SCREEN ANIMATION */
        .reward-pop { animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popIn { from{transform:scale(0);} to{transform:scale(1);} }
        
        #loader { background: #111; z-index: 100; color: var(--primary); font-family: var(--font-main); font-size: 24px; }

    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    
    <audio id="bgm" loop>
        <source src="amar.mp3" type="audio/mpeg">
    </audio>

    <div id="game-canvas"></div>

    <!-- LOADER -->
    <div id="loader" class="ui-layer screen">
        <div>LOADING...</div>
    </div>

    <!-- MAIN MENU -->
    <div id="menu" class="ui-layer screen interactive">
        <div class="menu-content">
            <h1>
                <span id="master-crown">👑</span>
                Einar<br><span style="color:white; font-size:30px;">vs</span><br>Amar
            </h1>
            
            <div class="level-badge" style="margin-bottom:10px;">
                <span class="star-icon" id="menu-star">★</span> <span id="menu-lvl">Lvl 1</span>
            </div>
            
            <div class="card-container" id="map-select">
                <!-- JS Populated -->
            </div>
            
            <div class="btn-container">
                <button class="btn" onclick="Game.start()">PLAY</button>
                <div class="btn-row">
                    <button class="btn btn-small btn-shop" onclick="UI.toShop()">SHOP</button>
                    <button class="btn btn-small btn-tex" onclick="UI.toTextures()">SKINS</button>
                </div>
            </div>
        </div>
    </div>

    <!-- SHOP -->
    <div id="shop" class="ui-layer screen interactive hidden">
        <h2>SHOP</h2>
        <div id="best-run-display">Best Run: None</div>
        <div style="display:flex; gap:20px; margin-bottom:20px;">
            <div class="stat-badge"><span style="color:#FFD700">●</span> <span id="shop-coins">0</span></div>
            <div class="stat-badge"><span style="color:#00FFFF">♦</span> <span id="shop-gems">0</span></div>
        </div>
        <div class="shop-grid" id="shop-list"></div>
        <button class="btn btn-small" onclick="UI.toMenu()" style="margin-top:20px;">BACK</button>
    </div>

    <!-- TEXTURES / SHOWCASE (LABORATORY) -->
    <div id="textures" class="ui-layer screen-clear hidden">
        <div id="tex-touch-area"></div> 
        
        <div id="tex-viewer">
            <div class="tex-controls">
                <button class="btn btn-small" onclick="Game.switchTexture(-1)">&#9664;</button>
                <h2 id="tex-name" style="margin:0; min-width:150px; text-shadow:2px 2px 5px black;">Einar</h2>
                <button class="btn btn-small" onclick="Game.switchTexture(1)">&#9654;</button>
            </div>
            <div style="display:flex; flex-direction:column; align-items:center; gap:10px; z-index:20; width:100%;">
                <div class="tex-info">
                    <h2 id="tex-title">Einar</h2>
                    <p id="tex-desc">Description...</p>
                </div>
                <div style="display:flex; gap:10px;">
                    <button id="customize-btn" class="btn btn-small" style="display:none;" onclick="Customize.open()">CUSTOMIZE</button>
                    <button id="tex-back-btn" class="btn btn-small" onclick="UI.toMenu()">BACK</button>
                </div>
            </div>
        </div>
    </div>

    <!-- CUSTOMIZE SCREEN -->
    <div id="customize" class="ui-layer hidden">
        <div class="cust-left-panel">
            <h2 style="color:var(--primary); font-family:var(--font-main);">WARDROBE</h2>
            
            <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                <div class="stat-badge" style="font-size:14px;"><span style="color:#00FFFF">♦</span> <span id="cust-gems">0</span></div>
            </div>

            <div class="cust-tabs" id="part-tabs">
                <!-- Generated by JS -->
            </div>

            <div class="color-grid" id="color-grid">
                <!-- Generated by JS -->
            </div>

            <div style="margin-top:auto;">
                <h3 style="margin:5px 0;">SAVED OUTFITS</h3>
                <div class="slots-grid" id="slots-grid">
                    <!-- Generated by JS -->
                </div>
            </div>

            <div style="margin-top:15px; display:flex; gap:10px;">
                <button class="btn btn-small" style="flex:1; padding:10px;" onclick="Customize.saveSlot()">SAVE</button>
                <button class="btn btn-small" style="flex:1; padding:10px; background:#444; box-shadow:none;" onclick="Customize.close()">EXIT</button>
            </div>
        </div>
        <div class="cust-right-area" id="cust-3d-area"></div>
    </div>

    <!-- MODAL -->
    <div id="modal" class="hidden">
        <div class="modal-content">
            <h3 id="modal-title">Confirm</h3>
            <p id="modal-text">Buy this color?</p>
            <div id="modal-preview" style="width:50px; height:50px; border-radius:50%; margin:10px auto; border:2px solid white;"></div>
            <div style="display:flex; gap:10px; justify-content:center; margin-top:15px;">
                <button class="btn btn-small" onclick="UI.confirmModal()">YES</button>
                <button class="btn btn-small" style="background:#444; box-shadow:none;" onclick="UI.closeModal()">NO</button>
            </div>
        </div>
    </div>

    <!-- HUD -->
    <div id="hud" class="ui-layer hidden">
        <div style="display:flex; gap:10px;">
            <div class="stat-badge"><span class="heart-icon">♥</span> <span id="hud-hp">3</span></div>
        </div>
        <div id="hud-center">00:00</div>
        <div style="display:flex; gap:10px;">
            <div class="stat-badge"><span style="color:#FFD700">●</span> <span id="hud-coins">0</span></div>
            <div class="stat-badge" style="background:rgba(255,0,0,0.3); border-color:red"><span style="color:white">⚠</span> <span id="hud-timer">60</span></div>
        </div>
    </div>
    
    <div id="zone-warning" class="ui-layer">ISLAND SHRINKING!</div>

    <!-- Controls -->
    <div id="controls" class="ui-layer hidden">
        <div id="joystick-area">
            <div id="stick-bg"></div>
            <div id="stick-thumb"></div>
        </div>
        <div id="ability-btn" class="interactive">
            <i>⚡</i>
        </div>
    </div>

    <!-- GAME OVER / RESULTS -->
    <div id="gameover" class="ui-layer screen interactive hidden">
        <h1 style="color:#ff5252">EATEN!</h1>
        <h2 id="final-score" style="margin:0; color:white;">00:00</h2>
        
        <!-- Experience Animation -->
        <div style="margin: 15px 0; width:100%; display:flex; flex-direction:column; align-items:center;">
            <div id="xp-text" style="color:#00BFFF; font-weight:bold; margin-bottom:5px;">+0 XP</div>
            <div class="xp-container">
                <div class="xp-bar-fill" id="xp-bar"></div>
            </div>
            <div class="level-badge">
                <span class="star-icon" id="res-star">★</span> <span id="res-lvl">1</span>
            </div>
            <div id="lvl-up-msg" style="color:#00FF00; font-family:var(--font-main); font-size:24px; margin-top:5px; display:none;" class="reward-pop">LEVEL UP!</div>
            <div id="unlock-msg" style="color:orange; font-size:16px; margin-top:5px; display:none;" class="reward-pop">UNLOCKED: DESERT</div>
        </div>

        <p>Rewards:</p>
        <div style="display:flex; gap:15px; justify-content:center; margin-bottom:20px;">
            <div class="stat-badge">+<span id="end-coins">0</span> ●</div>
            <div class="stat-badge">+<span id="end-gems">0</span> ♦</div>
        </div>
        <button class="btn" onclick="Game.toMenu()">MENU</button>
    </div>

<script>
const AudioSys = {
    ctx: null,
    bgm: null,
    init() { 
        if(!this.ctx) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)(); 
            this.bgm = document.getElementById('bgm');
            this.playBGM();
        }
    },
    playBGM() {
        if(this.bgm && this.bgm.paused) {
            this.bgm.play().catch(e => console.log("Audio play failed interaction required"));
        }
    },
    playTone(freq, type, dur, vol=0.1, slide=0) {
        if(!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        if(slide) osc.frequency.exponentialRampToValueAtTime(slide, this.ctx.currentTime + dur);
        gain.gain.setValueAtTime(vol, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + dur);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime + dur);
    },
    sfx: {
        coin: () => { AudioSys.playTone(1200, 'sine', 0.1, 0.1); setTimeout(()=>AudioSys.playTone(1800, 'sine', 0.2, 0.1), 50); },
        dash: () => AudioSys.playTone(400, 'sawtooth', 0.2, 0.1, 100), // Changed dash sound
        hit: () => AudioSys.playTone(100, 'square', 0.3, 0.2, 10),
        step: () => AudioSys.playTone(80, 'triangle', 0.05, 0.02),
        parrot: () => AudioSys.playTone(1500, 'sawtooth', 0.1, 0.1, 1000),
        bark: () => { // New bark sound
            AudioSys.playTone(300, 'square', 0.05, 0.1, 200);
            setTimeout(() => AudioSys.playTone(250, 'square', 0.08, 0.1, 150), 60);
        },
        levelup: () => { 
            AudioSys.playTone(400, 'sine', 0.1, 0.2); 
            setTimeout(()=>AudioSys.playTone(600, 'sine', 0.1, 0.2), 100);
            setTimeout(()=>AudioSys.playTone(800, 'sine', 0.3, 0.2), 200);
        }
    }
};

const Assets = {
    materials: {
        skin: new THREE.MeshToonMaterial({color: 0xffccaa}),

    // Modified to support colors

            return base;
        }

        const torso = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.2, 0.5), getMat(this.materials.shirt, 'shirt'));
        torso.position.y = 1.4; torso.castShadow = true;

        const headGroup = new THREE.Group(); headGroup.position.y = 2.3;

        head.name = 'skin';
        headGroup.add(head);
        
        const hair = new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.25, 0.75), getMat(this.materials.hair, 'hair'));

        };
        headGroup.add(createEye(0.18), createEye(-0.18));
        group.add(headGroup);
        
        const backpack = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.8, 0.3), colors && colors.backpack ? new THREE.MeshToonMaterial({color:colors.backpack}) : new THREE.MeshToonMaterial({color: 0x555555}));
        backpack.position.set(0, 1.5, -0.35); backpack.name = 'backpack'; group.add(backpack);
        
        const createLimb = (matKey, defaultMat, x, y, isLeg) => {
            const pivot = new THREE.Group(); pivot.position.set(x, y, 0);

    unlockedColors: [], // Array of hexes

    init() {
        // Load data
        const save = localStorage.getItem('einar_custom_v1');
        if(save) {
            const d = JSON.parse(save);
            this.unlockedColors = d.unlocked || [];
            if(d.slots) {
                // Restore slots (skip default)
                for(let i=1; i<this.slots.length; i++) {
                    if(d.slots[i]) this.slots[i] = d.slots[i];
                }
            }
            this.activeSlot = d.activeSlot || 0;
        }
        this.tempColors = this.slots[this.activeSlot].colors ? {...this.slots[this.activeSlot].colors} : {};
    },

    save() {
        const slotsToSave = [...this.slots];
        localStorage.setItem('einar_custom_v1', JSON.stringify({
            unlocked: this.unlockedColors,
            slots: slotsToSave,
            activeSlot: this.activeSlot
        }));
    },

    open() {
        Game.state = 'customize';
        UI.setScreen('customize');
        this.renderUI();
        this.selectPart('Hair');
        Game.loadCustomizeScene();
    },

    close() {
        // Revert to active slot colors
        this.tempColors = this.slots[this.activeSlot].colors ? {...this.slots[this.activeSlot].colors} : {};
        UI.toTextures();
    },

    selectPart(part) {
        this.currentPart = part;
        this.renderUI();
        Game.setCameraTarget(part);
    },

    renderUI() {
        document.getElementById('cust-gems').innerText = Game.stats.gems;
        
        // Tabs
        const tabCont = document.getElementById('part-tabs'); tabCont.innerHTML = '';
        this.parts.forEach(p => {
            const btn = document.createElement('div');
            btn.className = `cust-tab-btn ${this.currentPart === p ? 'active' : ''}`;
            btn.innerText = p;
            btn.onclick = () => this.selectPart(p);
            tabCont.appendChild(btn);
        });

        // Colors
        const grid = document.getElementById('color-grid'); grid.innerHTML = '';
        const currentHex = this.tempColors[this.currentPart.toLowerCase()] || this.getDefaultColor(this.currentPart);

        this.colors.forEach(c => {
            const isUnlocked = c.lvl === 0 || this.unlockedColors.includes(c.hex);
            const isLevelOk = Game.getLevel(Game.stats.xp) >= c.lvl;
            
            const div = document.createElement('div');
            div.className = `color-item ${currentHex === c.hex ? 'selected' : ''}`;
            if(!isUnlocked && !isLevelOk) div.classList.add('locked');
            div.style.backgroundColor = '#' + c.hex.toString(16).padStart(6, '0');
            
            div.onclick = () => {
                if(!isLevelOk && !isUnlocked) return; // Completely locked by level
                if(!isUnlocked) {
                    UI.showBuyModal(c);
                } else {
                    this.applyColor(c.hex);
                }
            };
            grid.appendChild(div);
        });

        // Slots
        const slotGrid = document.getElementById('slots-grid'); slotGrid.innerHTML = '';
        this.slots.forEach((s, i) => {
            const card = document.createElement('div');
            card.className = `slot-card ${this.activeSlot === i ? 'active' : ''}`;
            
            let content = '';
            if(i === 0) {
                content = `<div class="slot-img" style="background:#333; display:flex; align-items:center; justify-content:center;">DEF</div><span>Default</span>`;
            } else {
                content = `<img class="slot-img" src="${s.img || ''}" style="opacity:${s.img?1:0.2}">
                           <input class="slot-name" value="${s.name}" onchange="Customize.renameSlot(${i}, this.value)" onclick="event.stopPropagation()">`;
            }
            card.innerHTML = content;
            card.onclick = () => this.loadSlot(i);
            slotGrid.appendChild(card);
        });
    },

    getDefaultColor(part) {
        const map = {
            'hair': 0x5D4037, 'skin': 0xffccaa, 'shirt': 0x2196F3, 'pants': 0x333333,
            'backpack': 0x555555, 'eyes': 0x000000, 'shoes': 0x222222
        };
        return map[part.toLowerCase()] || 0xFFFFFF;
    },

    applyColor(hex) {
        this.tempColors[this.currentPart.toLowerCase()] = hex;
        Game.updatePlayerColors(this.tempColors);
        this.renderUI();
    },

    loadSlot(idx) {
        this.activeSlot = idx;
        const s = this.slots[idx];
        this.tempColors = s.colors ? {...s.colors} : {};
        // If loading default, clear tempColors to rely on defaults
        if(idx === 0) this.tempColors = {};
        Game.updatePlayerColors(this.tempColors);
        this.save();
        this.renderUI();
    },

    saveSlot() {
        if(this.activeSlot === 0) return; // Cannot save to default
        // Snapshot
        Game.renderer.render(Game.scene, Game.camera);
        const img = Game.renderer.domElement.toDataURL('image/png');
        
        this.slots[this.activeSlot].colors = {...this.tempColors};
        this.slots[this.activeSlot].img = img;
        this.save();
        this.renderUI();
    },

    renameSlot(idx, name) {
        this.slots[idx].name = name;
        this.save();
    },
    
    unlockColor(hex) {
        this.unlockedColors.push(hex);
        Game.stats.gems -= 5;
        AudioSys.sfx.coin();
        Game.save();
        this.save(); // Save unlocked list
        this.applyColor(hex);
        UI.closeModal();
    }
};

const Game = {
    state: 'init',
    maps: {
        forest: { name: "Forest", color: 0x4CAF50, bg: 0x81C784, friction: 0.8, levelReq: 0 },
        desert: { name: "Desert", color: 0xFFB74D, bg: 0xFFE0B2, friction: 0.8, levelReq: 10 },
        ice: { name: "Arctic", color: 0xB3E5FC, bg: 0xE1F5FE, friction: 0.85, levelReq: 25 }, 
        studio: { name: "Studio", color: 0x424242, bg: 0x616161, friction: 0.8, levelReq: 55 },
        city: { name: "City", color: 0x333333, bg: 0x111122, friction: 0.9, levelReq: 80 }
    },
    
    scene: null, camera: null, renderer: null, clock: new THREE.Clock(),
    player: null, enemies: [], coins: [], props: [],
    ground: null, water: null,
    currentMap: 'forest',
    joystick: { x: 0, y: 0, active: false },
    keys: { w: false, a: false, s: false, d: false },
    zone: { radius: 120, target: 120, mesh: null, time: 60 },
    stats: { coins: 0, gems: 0, time: 0, xp: 0 },
    upgrades: { speed: 0, hp: 0, agility: 0, turbo: 0 },
    bestRun: { map: '-', time: 0 },
    
    textureIdx: 0, textureModel: null, labEnvironment: null,
    custCamTarget: new THREE.Vector3(), custCamLookAt: new THREE.Vector3(),
    
    textureData: [
        { name: "Einar", desc: "A brave traveler.", create: (c) => Assets.createPlayer(c) },
        { name: "Amar", desc: "Main antagonist. Basenji.", create: () => Assets.createAmar() },
        { name: "Milo", desc: "Loyal partner.", create: () => Assets.createMilo() },
        { name: "Timosha", desc: "Rare blue parrot.", create: () => Assets.createTimosha() },
        { name: "Cosmo", desc: "Fast hamster.", create: () => Assets.createCosmo() }
    ],

    init() {
        const save = localStorage.getItem('einar_save_v18');
        if(save) {
            const d = JSON.parse(save);
            this.stats.coins = d.coins || 0;
            this.stats.gems = d.gems || 0;
            this.stats.xp = d.xp || 0;
            this.upgrades = d.upgrades || {speed:0, hp:0, agility:0, turbo:0};
            if(typeof this.upgrades.turbo === 'undefined') this.upgrades.turbo = 0; // Backwards compatibility
            this.bestRun = d.bestRun || { map: '-', time: 0 };
        }
        
        Customize.init(); // Load custom data
        
        this.scene = new THREE.Scene();
        this.camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 100);
        this.renderer = new THREE.WebGLRenderer({antialias: true, alpha: false, preserveDrawingBuffer: true}); // Enabled preserveDrawingBuffer for snapshots
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        this.renderer.setPixelRatio(window.devicePixelRatio);
        this.renderer.shadowMap.enabled = true;
        this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        this.renderer.outputEncoding = THREE.sRGBEncoding;

    getLevel(xp) { return Math.floor(xp / 1000) + 1; },
    
    getLevelColor(lvl) {
        if(lvl >= 100) return '#FF0000'; // Max
        if(lvl >= 75) return '#9D00FF'; // Cosmic
        if(lvl >= 50) return '#B9F2FF'; // Diamond
        if(lvl >= 30) return '#E5E4E2'; // Platinum
        if(lvl >= 20) return '#FFD700'; // Gold
        if(lvl >= 10) return '#C0C0C0'; // Silver

    },

    save() {
        localStorage.setItem('einar_save_v18', JSON.stringify({ 
            coins: this.stats.coins, 
            gems: this.stats.gems, 
            xp: this.stats.xp,
            upgrades: this.upgrades,

        }));

    addLights(isGame = false) {
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.7);

        this.scene.add(hemiLight);

            dirLight.shadow.mapSize.width = 2048; dirLight.shadow.mapSize.height = 2048;
            dirLight.shadow.camera.left = -60; dirLight.shadow.camera.right = 60;

    loadMenuScene() {
        this.clearScene();
        this.addLights(false); 
        this.scene.background = new THREE.Color(0x1a1a2e);
        this.scene.fog = null;
        const menuFloor = new THREE.Mesh(new THREE.PlaneGeometry(50, 50), new THREE.MeshToonMaterial({color: 0x222233}));
        menuFloor.rotation.x = -Math.PI/2; menuFloor.receiveShadow = true; this.scene.add(menuFloor);

        const a = Assets.createAmar();

    start() {
        if (document.activeElement) document.activeElement.blur();
        this.state = 'play';
        UI.setScreen('controls');
        UI.showHUD(true);
        AudioSys.init();
        this.clearScene();
        this.addLights(true); 

        this.enemies = []; this.coins = []; this.props = [];
        this.stats.time = 0;
        const map = this.maps[this.currentMap];
        this.scene.background = new THREE.Color(map.bg);
        this.scene.fog = new THREE.Fog(map.bg, 40, 140); 
        
        // Island (Circular Ground)
        this.zone.radius = 120; this.zone.target = 120; this.zone.time = 60;
        const groundGeo = new THREE.CylinderGeometry(1, 1, 1, 64);
        this.ground = new THREE.Mesh(groundGeo, new THREE.MeshToonMaterial({color: map.color}));
        this.ground.position.y = -0.5; 
        this.ground.scale.set(this.zone.radius, 1, this.zone.radius);
        this.ground.receiveShadow = true; 
        this.scene.add(this.ground);

        // Water (Surrounding Plane)
        this.water = new THREE.Mesh(new THREE.PlaneGeometry(2000, 2000), Assets.materials.waterBlue);
        this.water.rotation.x = -Math.PI/2;
        this.water.position.y = -0.55; 
        this.scene.add(this.water);
        
        // Use active slot colors
        const activeColors = Customize.slots[Customize.activeSlot].colors;
        const pObj = Assets.createPlayer(activeColors);
        this.player = {
            mesh: pObj.mesh, limbs: pObj.limbs,
            pos: new THREE.Vector3(0,0,0), vel: new THREE.Vector3(0,0,0),
            hp: 3 + this.upgrades.hp, speed: 32 + (this.upgrades.speed * 1.12),
            invuln: 0, dashCd: 0
        };
        this.scene.add(this.player.mesh);
        
        const propCount = this.currentMap === 'studio' ? 25 : this.currentMap === 'city' ? 30 : 80;
        for(let i=0; i<propCount; i++) {
            const angle = Math.random() * Math.PI * 2;
            const r = Math.sqrt(Math.random()) * (this.zone.radius - 5);
            const x = Math.cos(angle) * r;
            const z = Math.sin(angle) * r;
            
            let mesh, radius = 1.5; let isTumbleweed = false;
            
            if(this.currentMap === 'forest') mesh = Assets.createTree();
            else if(this.currentMap === 'studio') {
                mesh = Assets.createOfficeSetup(); mesh.rotation.y = Math.random() * Math.PI * 2;
                mesh.scale.set(1.5, 1.5, 1.5); radius = 2.5; 
            }
            else if(this.currentMap === 'desert') {
                if(Math.random() < 0.2) { mesh = Assets.createTumbleweed(); isTumbleweed = true; radius = 0.5; mesh.position.y = 0.5; } 
                else { mesh = Assets.createCactus(); }
            }
            else if(this.currentMap === 'city') {
                if(Math.random() < 0.7) {
                    mesh = Assets.createSkyscraper();
                    radius = 2.5; // Larger collision for buildings
                } else {
                    // Park area
                    const parkGroup = new THREE.Group();
                    const tree = Assets.createTree(); parkGroup.add(tree);
                    const bench = Assets.createBench(); bench.position.set(1, 0, 1); bench.rotation.y = Math.random(); parkGroup.add(bench);
                    mesh = parkGroup;
                }
                // Add some roads (visual only) nearby
                if(Math.random() < 0.5) {
                    const road = Assets.createRoadMarking();
                    road.position.set(x + (Math.random()-0.5)*10, 0.01, z + (Math.random()-0.5)*10);
                    road.rotation.z = Math.random() * Math.PI;
                    this.scene.add(road);
                }
            }
            else mesh = new THREE.Mesh(new THREE.DodecahedronGeometry(1 + Math.random()), new THREE.MeshToonMaterial({color:0x777777}));
            
            if(!isTumbleweed) {
                mesh.position.set(x, this.currentMap!=='forest' && this.currentMap!=='studio' && this.currentMap!=='desert' && this.currentMap!=='city' ? 1 : 0, z);
                if(this.currentMap === 'forest' || this.currentMap === 'desert') mesh.rotation.y = Math.random() * Math.PI;
            } else { mesh.position.set(x, 0.5, z); }
            
            this.scene.add(mesh);
            this.props.push({mesh, r: radius, isTumbleweed, vel: isTumbleweed ? new THREE.Vector3(Math.random()-0.5, 0, Math.random()-0.5).normalize().multiplyScalar(5) : null});
        }
        UI.updateHUD();
    },

    spawnEnemy() {
        const angle = Math.random() * Math.PI * 2; const r = this.zone.radius * 0.9; // Spawn slightly inside
        const x = Math.cos(angle) * r;
        const z = Math.sin(angle) * r;
        let type = 'amar'; const rand = Math.random();
        
        if (rand < 0.10) { if(this.currentMap === 'ice' || this.currentMap === 'studio' || this.currentMap === 'city') type = 'cosmo'; }
        else if (rand < 0.25) { if(this.currentMap !== 'ice') type = 'timosha'; }
        else if (rand < 0.55) type = 'milo';

        let obj, speed;
        if(type === 'cosmo') { obj = Assets.createCosmo(); speed = 6.3 + Math.min(this.stats.time/30, 4); }
        else if(type === 'timosha') { obj = Assets.createTimosha(); speed = 8.73 + Math.min(this.stats.time/30, 6); }
        else if(type === 'milo') { obj = Assets.createMilo(); speed = 9.5 + Math.min(this.stats.time/30, 6); }
        else { obj = Assets.createAmar(); speed = 9.0 + Math.min(this.stats.time/30, 6); }
        
        obj.mesh.position.set(x, 0, z); this.scene.add(obj.mesh);
        this.enemies.push({
            mesh: obj.mesh, head: obj.head, limbs: obj.limbs, wings: obj.wings,
            vel: new THREE.Vector3(), speed: speed, type: type, animOffset: Math.random() * 10
        });
        if(type === 'timosha') AudioSys.sfx.parrot();
        if(type === 'amar' || type === 'milo') AudioSys.sfx.bark();
    },

    spawnCoin() {
        const angle = Math.random() * Math.PI * 2; 
        const dist = Math.sqrt(Math.random()) * (this.zone.radius * 0.9);
        const x = Math.cos(angle) * dist; const z = Math.sin(angle) * dist;
        const isGem = Math.random() < 0.1;
        let mesh;
        if (isGem) { mesh = new THREE.Mesh(new THREE.ConeGeometry(0.5, 1, 4), Assets.materials.gem); mesh.rotation.x = Math.PI; } 
        else { mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.8, 0.15, 16), Assets.materials.coin); mesh.rotation.x = Math.PI/2; }
        mesh.position.set(x, 1, z); this.scene.add(mesh);
        this.coins.push({mesh, isGem, active: true});
    },

    loadShowcase(idx) {
        this.state = 'textures';
        this.clearScene();
        // Lab Lighting
        const amb = new THREE.AmbientLight(0xffffff, 0.8); this.scene.add(amb);
        const spot = new THREE.SpotLight(0xffffff, 1.5); spot.position.set(5, 10, 5); spot.castShadow = true; this.scene.add(spot);
        const blueLight = new THREE.PointLight(0x00BFFF, 0.5, 10); blueLight.position.set(0, 2, -2); this.scene.add(blueLight);

        this.scene.background = new THREE.Color(0x050510);
        
        this.labEnvironment = Assets.createLabEnvironment();
        this.scene.add(this.labEnvironment);

        const data = this.textureData[idx];
        // Pass tempColors if it's player, otherwise null
        const obj = data.create(idx === 0 ? Customize.tempColors : null);
        this.textureModel = obj.mesh;
        this.textureModel.position.set(0, 0, 0);
        this.scene.add(this.textureModel);

        this.camera.position.set(0, 2, 5);
        this.camera.lookAt(0, 1, 0);

        document.getElementById('tex-name').innerText = data.name;
        document.getElementById('tex-title').innerText = data.name;
        document.getElementById('tex-desc').innerText = data.desc;
        
        // Show Customize button only for Einar
        document.getElementById('customize-btn').style.display = (idx === 0) ? 'block' : 'none';
    },

    loadCustomizeScene() {
        this.clearScene();
        // Bright, clear lighting for customization
        const amb = new THREE.AmbientLight(0xffffff, 1.0); this.scene.add(amb);
        const dir = new THREE.DirectionalLight(0xffffff, 0.8); dir.position.set(2, 5, 5); this.scene.add(dir);
        this.scene.background = new THREE.Color(0x1a1a2e); // Match menu/dark theme but clear

        // Player with temp colors
        const obj = Assets.createPlayer(Customize.tempColors);
        this.textureModel = obj.mesh;
        this.textureModel.position.set(0, 0, 0);
        this.scene.add(this.textureModel);
        
        // Setup initial camera
        this.camera.position.set(0, 2, 4);
        this.camera.lookAt(0, 1.5, 0);
        
        // Setup targets for lerp
        this.custCamTarget.set(0, 2, 4);
        this.custCamLookAt.set(0, 1.5, 0);
    },

    updatePlayerColors(colors) {
        if(this.textureModel) {
            this.scene.remove(this.textureModel);
            const obj = Assets.createPlayer(colors);
            this.textureModel = obj.mesh;
            this.textureModel.position.set(0, 0, 0);
            this.textureModel.rotation.y = 0; // Reset rot or keep? Better keep.
            // Actually, let's keep rotation
            // this.textureModel.rotation.y = oldRot; 
            this.scene.add(this.textureModel);
        }
    },
    
    setCameraTarget(part) {
        // "Right side" is where character is. Move camera slightly left to center char in right space
        const xOffset = 0; 
        if(part === 'Head' || part === 'Hair' || part === 'Eyes') {
            this.custCamTarget.set(xOffset, 2.3, 2);
            this.custCamLookAt.set(xOffset, 2.3, 0);
        } else if(part === 'Shoes') {
            this.custCamTarget.set(xOffset, 0.5, 2);
            this.custCamLookAt.set(xOffset, 0, 0);
        } else if(part === 'Pants') {
            this.custCamTarget.set(xOffset, 0.8, 2.5);
            this.custCamLookAt.set(xOffset, 0.8, 0);
        } else {
            // Shirt/Skin/Backpack
            this.custCamTarget.set(xOffset, 1.4, 2.5);
            this.custCamLookAt.set(xOffset, 1.4, 0);
        }
    },

    switchTexture(dir) {
        this.textureIdx += dir;
        if(this.textureIdx < 0) this.textureIdx = this.textureData.length - 1;
        if(this.textureIdx >= this.textureData.length) this.textureIdx = 0;
        this.loadShowcase(this.textureIdx);
    },

    onTextureDrag(dx) { if(this.textureModel) this.textureModel.rotation.y += dx * 0.01; },

    update(dt) {
        if(this.state === 'textures' && this.labEnvironment) {
            this.labEnvironment.userData.time += dt;
            this.labEnvironment.userData.scanRing.position.y = 1 + Math.sin(this.labEnvironment.userData.time * 2) * 1;
            this.labEnvironment.userData.scanRing.scale.setScalar(1 + Math.sin(this.labEnvironment.userData.time * 2) * 0.2);
            return; 
        }

        if(this.state === 'customize') {
            // Camera Lerp
            this.camera.position.lerp(this.custCamTarget, dt * 3);
            // Interpolate lookAt manually or just lookAt
            const currentLook = new THREE.Vector3();
            this.camera.getWorldDirection(currentLook);
            const targetDir = new THREE.Vector3().subVectors(this.custCamLookAt, this.camera.position).normalize();
            const newDir = new THREE.Vector3().lerpVectors(currentLook, targetDir, dt * 5).normalize();
            const lookAtPos = new THREE.Vector3().addVectors(this.camera.position, newDir);
            this.camera.lookAt(lookAtPos);
            return;
        }

        if(this.state === 'menu') {
            this.menuAnim.time += dt * 10; const t = this.menuAnim.time;
            const pLimbs = this.menuAnim.player.limbs;
            pLimbs.legL.rotation.x = Math.sin(t) * 0.8; pLimbs.legR.rotation.x = Math.sin(t + Math.PI) * 0.8;
            pLimbs.armL.rotation.x = Math.sin(t + Math.PI) * 0.8; pLimbs.armR.rotation.x = Math.sin(t) * 0.8;
            this.menuAnim.player.mesh.position.y = Math.abs(Math.sin(t)) * 0.1;
            return;
        }

        if(this.state !== 'play') return;
        this.stats.time += dt;
        const mins = Math.floor(this.stats.time / 60).toString().padStart(2, '0');
        const secs = Math.floor(this.stats.time % 60).toString().padStart(2, '0');
        document.getElementById('hud-center').innerText = `${mins}:${secs}`;

        // Shrinking Logic
        this.zone.time -= dt;
        if(this.zone.time <= 0) {
            const shrink = 0.1 + Math.random() * 0.1; // 10-20%
            this.zone.target = Math.max(30, this.zone.radius * (1 - shrink));
            this.zone.time = 60; // Reset to 60s
            document.getElementById('zone-warning').style.opacity = 1;
            setTimeout(()=>document.getElementById('zone-warning').style.opacity=0, 3000);
        }
        this.zone.radius += (this.zone.target - this.zone.radius) * dt * 0.5;
        this.ground.scale.set(this.zone.radius, 1, this.zone.radius); // Scale Island

        const desiredEnemies = Math.floor(this.stats.time / 10) + 1;
        if(this.enemies.length < desiredEnemies && this.stats.time > 3) this.spawnEnemy();
        if(this.coins.length < 10) this.spawnCoin();

        const p = this.player; const map = this.maps[this.currentMap];
        let moveX = 0; let moveY = 0;
        if(this.joystick.active) { moveX = this.joystick.x; moveY = this.joystick.y; }
        else {
            if(this.keys.w) moveY -= 1; if(this.keys.s) moveY += 1;
            if(this.keys.a) moveX -= 1; if(this.keys.d) moveX += 1;
            if(moveX || moveY) { const len = Math.hypot(moveX, moveY); moveX /= len; moveY /= len; }
        }
        if(moveX || moveY) {
            p.vel.x += moveX * p.speed * 4 * dt; p.vel.z += moveY * p.speed * 4 * dt;
            p.mesh.rotation.y = Math.atan2(moveX, moveY);
        }
        if(p.dashCd > 0) p.dashCd -= dt;
        
        p.pos.add(p.vel.clone().multiplyScalar(dt)); 
        const frictionFactor = Math.pow(map.friction, dt * 60);
        p.vel.multiplyScalar(frictionFactor);
        
        // Island Bound Collision
        if(p.pos.length() > this.zone.radius) {
            p.pos.normalize().multiplyScalar(this.zone.radius);
            p.vel.multiplyScalar(0.5); // Slow down on hit
        }
        p.mesh.position.copy(p.pos);

        const speed = p.vel.length(); const animTime = this.stats.time * 15;
        if(speed > 0.5) {
            p.limbs.legL.rotation.x = Math.sin(animTime) * 0.8; p.limbs.legR.rotation.x = Math.sin(animTime + Math.PI) * 0.8;
            p.limbs.armL.rotation.x = Math.sin(animTime + Math.PI) * 0.8; p.limbs.armR.rotation.x = Math.sin(animTime) * 0.8;
        } else { p.limbs.legL.rotation.x = 0; p.limbs.legR.rotation.x = 0; }

        this.props.forEach(prop => {
            if(prop.isTumbleweed) {
                 prop.mesh.position.add(prop.vel.clone().multiplyScalar(dt));
                 prop.mesh.rotation.z -= dt * 5; prop.mesh.rotation.x -= dt * 3;
                 if(prop.mesh.position.length() > this.zone.radius) prop.vel.multiplyScalar(-1);
            }
            const dx = p.pos.x - prop.mesh.position.x; const dz = p.pos.z - prop.mesh.position.z; const dist = Math.hypot(dx, dz);
            if(dist < prop.r) {
                const angle = Math.atan2(dz, dx); const pushDist = prop.r - dist;
                p.pos.x += Math.cos(angle) * pushDist; p.pos.z += Math.sin(angle) * pushDist; p.mesh.position.copy(p.pos);
            }
        });

        for(let i=this.enemies.length-1; i>=0; i--) {
            const e = this.enemies[i];
            const dir = p.pos.clone().sub(e.mesh.position).normalize();
            this.enemies.forEach(other => {
                if(e === other) return;
                const d = e.mesh.position.distanceTo(other.mesh.position);
                if(d < 1.5) dir.add(e.mesh.position.clone().sub(other.mesh.position).normalize().multiplyScalar(2));
            });
            e.mesh.position.add(dir.multiplyScalar(e.speed * dt));
            e.mesh.lookAt(p.pos);
            const localTime = this.stats.time + e.animOffset;
            
            if(e.type === 'cosmo') {
                e.mesh.position.y = Math.abs(Math.sin(localTime * 15)) * 0.5;
                if(e.limbs) {
                    const runSpeed = localTime * 30;
                    e.limbs[0].rotation.x = Math.sin(runSpeed) * 0.8; e.limbs[1].rotation.x = Math.sin(runSpeed + Math.PI) * 0.8;
                    e.limbs[2].rotation.x = Math.sin(runSpeed + Math.PI) * 0.8; e.limbs[3].rotation.x = Math.sin(runSpeed) * 0.8;
                }
            } else if(e.type === 'timosha') {
                e.mesh.position.y = 1.5 + Math.sin(localTime * 10) * 0.3; 
                if(e.wings) { e.wings[0].rotation.z = Math.sin(localTime * 25) * 0.5 + 0.5; e.wings[1].rotation.z = -Math.sin(localTime * 25) * 0.5 - 0.5; }
                if(Math.hypot(p.pos.x - e.mesh.position.x, p.pos.z - e.mesh.position.z) < 4.0) e.mesh.position.add(dir.multiplyScalar(dt * 3)); 
            } else {
                e.mesh.position.y = Math.abs(Math.sin(localTime * 10)) * 0.2;
                if(e.limbs) {
                    const legSpeed = localTime * 20;
                    e.limbs[0].rotation.x = Math.sin(legSpeed) * 0.5; e.limbs[1].rotation.x = Math.sin(legSpeed + Math.PI) * 0.5;
                    e.limbs[2].rotation.x = Math.sin(legSpeed + Math.PI) * 0.5; e.limbs[3].rotation.x = Math.sin(legSpeed) * 0.5;
                }
            }
            if(Math.hypot(p.pos.x - e.mesh.position.x, p.pos.z - e.mesh.position.z) < 1.0) { this.takeDamage(); e.mesh.position.sub(dir.multiplyScalar(3)); }
        }

        this.coins.forEach((c, idx) => {
            if(!c.active) return;
            c.mesh.rotation.y += dt * 3;
            const dist = p.pos.distanceTo(c.mesh.position);
            if(dist < 5) c.mesh.position.lerp(p.pos, dt * 5);
            if(dist < 1) {
                c.active = false; this.scene.remove(c.mesh); this.coins.splice(idx, 1);
                AudioSys.sfx.coin(); if(c.isGem) this.stats.gems++; else this.stats.coins++;
                this.save();
                UI.updateHUD();
            }
        });

        this.camera.position.x += (p.pos.x - this.camera.position.x) * 3 * dt;
        this.camera.position.z += (p.pos.z + 25 - this.camera.position.z) * 3 * dt;
        this.camera.lookAt(p.pos);
        if(p.invuln > 0) { p.invuln -= dt; p.mesh.visible = Math.floor(this.stats.time * 20) % 2 === 0; }
        else p.mesh.visible = true;
    },

    takeDamage() {
        if(this.player.invuln > 0) return;
        this.player.hp--; this.player.invuln = 1.5; AudioSys.sfx.hit(); UI.updateHUD();
        const shake = 20;
        document.body.style.transform = `translate(${Math.random()*shake-shake/2}px, ${Math.random()*shake-shake/2}px)`;
        setTimeout(()=>document.body.style.transform = 'none', 100);
        if(this.player.hp <= 0) this.gameOver();
    },

    useAbility() {
        if(this.state !== 'play') return;
        const p = this.player;
        if(p.dashCd <= 0) {
            const dir = new THREE.Vector3(0,0,1).applyAxisAngle(new THREE.Vector3(0,1,0), p.mesh.rotation.y);
            const turboMult = 1 + (this.upgrades.turbo || 0) * 0.2; // +20% per level
            p.vel.add(dir.multiplyScalar(30 * turboMult)); 
            p.dashCd = 2.0; AudioSys.sfx.dash();
            const btn = document.getElementById('ability-btn');
            btn.style.opacity = 0.5; setTimeout(()=>btn.style.opacity = 1, 2000);
        }
    },

    gameOver() {
        this.state = 'gameover'; UI.showHUD(false); UI.setScreen('gameover');
        this.stats.coins += this.coins.filter(c=>!c.active).length;
        
        // --- EXPERIENCE LOGIC ---
        const xpEarned = Math.floor(this.stats.time * 10);
        const oldLevel = this.getLevel(this.stats.xp);
        this.stats.xp = Math.min(100000, this.stats.xp + xpEarned);
        const newLevel = this.getLevel(this.stats.xp);
        
        // Best Run Check
        if(this.stats.time > this.bestRun.time) {
            this.bestRun = { map: this.maps[this.currentMap].name, time: this.stats.time };
        }
        
        // Reset animation UI
        document.getElementById('xp-text').innerText = `+${xpEarned} XP`;
        document.getElementById('xp-bar').style.width = '0%';
        document.getElementById('res-lvl').innerText = oldLevel;
        document.getElementById('res-star').style.color = this.getLevelColor(oldLevel);
        document.getElementById('lvl-up-msg').style.display = 'none';
        document.getElementById('unlock-msg').style.display = 'none';

        // Animate XP Bar
        const progress = (this.stats.xp % 1000) / 10; // 0-100%
        setTimeout(() => {
            document.getElementById('xp-bar').style.width = `${progress}%`;
            // Check Level Up
            if(newLevel > oldLevel) {
                setTimeout(() => {
                    AudioSys.sfx.levelup();
                    document.getElementById('res-lvl').innerText = newLevel;
                    document.getElementById('res-star').style.color = this.getLevelColor(newLevel);
                    document.getElementById('lvl-up-msg').style.display = 'block';
                    this.stats.gems += (newLevel - oldLevel); // +1 Gem per level
                    
                    // Check Unlocks
                    let unlockText = "";
                    if(oldLevel < 10 && newLevel >= 10) unlockText = "UNLOCKED: DESERT";
                    else if(oldLevel < 25 && newLevel >= 25) unlockText = "UNLOCKED: ARCTIC";
                    else if(oldLevel < 55 && newLevel >= 55) unlockText = "UNLOCKED: STUDIO";
                    else if(oldLevel < 80 && newLevel >= 80) unlockText = "UNLOCKED: CITY";
                    
                    if(unlockText) {
                        const msg = document.getElementById('unlock-msg');
                        msg.innerText = unlockText;
                        msg.style.display = 'block';
                    }
                }, 1000);
            }
        }, 100);

        this.save();

        document.getElementById('end-coins').innerText = this.stats.coins;
        document.getElementById('end-gems').innerText = this.stats.gems;
        const mins = Math.floor(this.stats.time / 60).toString().padStart(2, '0');
        const secs = Math.floor(this.stats.time % 60).toString().padStart(2, '0');
        document.getElementById('final-score').innerText = `${mins}:${secs}`;
        document.getElementById('gameover').classList.remove('hidden');
    },

    animate() {
        requestAnimationFrame(()=>this.animate());
        const dt = Math.min(this.clock.getDelta(), 0.1);
        this.update(dt);
        this.renderer.render(this.scene, this.camera);
    },
    onResize() {
        this.camera.aspect = window.innerWidth/window.innerHeight;
        this.camera.updateProjectionMatrix();
        this.renderer.setSize(window.innerWidth, window.innerHeight);
    },

    setupControls() {
        const stick = document.getElementById('joystick-area');
        const thumb = document.getElementById('stick-thumb');
        const handleTouch = (e) => {
            e.preventDefault(); const touch = e.touches[0];
            const rect = stick.getBoundingClientRect();
            const cx = rect.left + rect.width/2; const cy = rect.top + rect.height/2;
            let dx = touch.clientX - cx; let dy = touch.clientY - cy;
            const dist = Math.min(Math.hypot(dx, dy), 50); const angle = Math.atan2(dy, dx);
            dx = Math.cos(angle) * dist; dy = Math.sin(angle) * dist;
            thumb.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
            this.joystick.x = dx / 50; this.joystick.y = dy / 50; this.joystick.active = true;
        };
        stick.addEventListener('touchstart', handleTouch);
        stick.addEventListener('touchmove', handleTouch);
        stick.addEventListener('touchend', (e) => {
             e.preventDefault(); thumb.style.transform = `translate(-50%, -50%)`;
             this.joystick.x = 0; this.joystick.y = 0; this.joystick.active = false;
        });
        document.getElementById('ability-btn').addEventListener('touchstart', (e)=>{ e.preventDefault(); this.useAbility(); });
        window.addEventListener('keydown', (e) => {
            const k = e.key.toLowerCase();
            if(k === 'w' || k === 'ц') this.keys.w = true; if(k === 'a' || k === 'ф') this.keys.a = true;
            if(k === 's' || k === 'ы') this.keys.s = true; if(k === 'd' || k === 'в') this.keys.d = true;
            if(e.code === 'Space') this.useAbility();
        });
        window.addEventListener('keyup', (e) => {
            const k = e.key.toLowerCase();
            if(k === 'w' || k === 'ц') this.keys.w = false; if(k === 'a' || k === 'ф') this.keys.a = false;
            if(k === 's' || k === 'ы') this.keys.s = false; if(k === 'd' || k === 'в') this.keys.d = false;
        });

        // Rotation logic handles both texture viewer and customize mode
        const texArea = document.getElementById('tex-touch-area');
        const custArea = document.getElementById('cust-3d-area');
        let isDrag = false; let lastX = 0;
        
        const startDrag = (e) => { isDrag = true; lastX = e.clientX || e.touches[0].clientX; };
        
        texArea.addEventListener('mousedown', startDrag);
        texArea.addEventListener('touchstart', startDrag);
        custArea.addEventListener('mousedown', startDrag);
        custArea.addEventListener('touchstart', startDrag);

        window.addEventListener('mousemove', (e) => { if(isDrag) { Game.onTextureDrag(e.clientX - lastX); lastX = e.clientX; } });
        window.addEventListener('touchmove', (e) => { if(isDrag) { Game.onTextureDrag(e.touches[0].clientX - lastX); lastX = e.touches[0].clientX; } });
        window.addEventListener('mouseup', () => isDrag = false);
        window.addEventListener('touchend', () => isDrag = false);
        
        document.body.addEventListener('click', () => AudioSys.playBGM(), {once:true});
    },
    clearScene() { while(this.scene.children.length > 0) this.scene.remove(this.scene.children[0]); },
    toMenu() { this.state = 'menu'; UI.setScreen('menu'); UI.showHUD(false); this.loadMenuScene(); },
};

const UI = {
    init() {
        this.updateMapSelection();
        this.updateShop();
        this.updateLevelDisplay();
    },
    updateLevelDisplay() {
        const lvl = Game.getLevel(Game.stats.xp);
        document.getElementById('menu-lvl').innerText = `Lvl ${lvl}`;
        const color = Game.getLevelColor(lvl);
        document.getElementById('menu-star').style.color = color;
        document.getElementById('menu-star').style.filter = `drop-shadow(0 0 5px ${color})`;
        
        if(lvl >= 100) document.getElementById('master-crown').style.display = 'block';
        else document.getElementById('master-crown').style.display = 'none';
        
        // Refresh map locks
        this.updateMapSelection();
    },
    updateMapSelection() {
        const mapCont = document.getElementById('map-select');
        mapCont.innerHTML = '';
        const currentLvl = Game.getLevel(Game.stats.xp);
        
        Object.keys(Game.maps).forEach(k => {
            const m = Game.maps[k];
            const locked = currentLvl < m.levelReq;
            
            const div = document.createElement('div');
            div.className = `card ${k===Game.currentMap?'selected':''} ${locked?'locked':''}`;
            div.innerHTML = `
                <div class="card-icon">${k=='forest'?'🌲':k=='desert'?'🌵':k=='ice'?'❄️':k=='studio'?'🏢':'🏙️'}</div>
                <div>${m.name}</div>
                <div class="lock-icon">🔒</div>
                ${locked ? `<div class="lvl-req">LVL ${m.levelReq}</div>` : ''}
            `;
            
            div.onclick = () => {
                if(locked) return;
                document.querySelectorAll('.card').forEach(c=>c.classList.remove('selected'));
                div.classList.add('selected');
                Game.currentMap = k;
            };
            mapCont.appendChild(div);
        });
    },
    setScreen(id) {
        document.querySelectorAll('.ui-layer').forEach(el => el.classList.add('hidden'));
        if(id) document.getElementById(id).classList.remove('hidden');
    },
    showHUD(show) {
        const hud = document.getElementById('hud');
        const controls = document.getElementById('controls');
        if(show) { hud.classList.remove('hidden'); controls.classList.remove('hidden'); }
        else { hud.classList.add('hidden'); controls.classList.add('hidden'); }
    },
    updateHUD() {
        if(Game.player) {
            document.getElementById('hud-hp').innerText = Game.player.hp;
            document.getElementById('hud-coins').innerText = Game.stats.coins;
            document.getElementById('hud-timer').innerText = Math.ceil(Game.zone.time);
        }
    },
    toShop() { this.setScreen('shop'); this.updateShop(); },
    toTextures() { UI.setScreen(null); Game.loadShowcase(0); document.getElementById('textures').classList.remove('hidden'); },
    toMenu() { this.setScreen('menu'); Game.toMenu(); },
    updateShop() {
        document.getElementById('shop-coins').innerText = Game.stats.coins;
        document.getElementById('shop-gems').innerText = Game.stats.gems;
        
        const mins = Math.floor(Game.bestRun.time / 60).toString().padStart(2, '0');
        const secs = Math.floor(Game.bestRun.time % 60).toString().padStart(2, '0');
        document.getElementById('best-run-display').innerText = `Best Run: ${Game.bestRun.map} - ${mins}:${secs}`;
        
        const list = document.getElementById('shop-list'); list.innerHTML = '';
        const upgrades = [
            { id: 'speed', name: 'Speed', desc: 'Run faster', cost: l => 100 + (l * 50), curr: 'coins', max: 5 },
            { id: 'hp', name: 'Health', desc: 'More hearts', cost: l => 5 + (l*2), curr: 'gems', max: 3 },
            { id: 'turbo', name: 'Turbo', desc: 'Dash Power +20%', cost: l => 20 + (l*10), curr: 'gems', max: 5 }
        ];
        upgrades.forEach(u => {
            const lvl = Game.upgrades[u.id] || 0; const cost = u.cost(lvl); const isMax = lvl >= u.max;
            const div = document.createElement('div'); div.className = 'shop-row';
            div.innerHTML = `<div><h3>${u.name} <small>Lvl ${lvl}</small></h3><small>${u.desc}</small></div>
                <button class="btn btn-small" style="padding:5px 15px; font-size:14px;" 
                ${isMax ? 'disabled' : ''} onclick="UI.buy('${u.id}')">${isMax ? 'MAX' : cost + (u.curr=='coins'?'●':'♦')}</button>`;
            list.appendChild(div);
        });
    },
    buy(id) {
        const upg = { 
            speed: {cost: l=>100*(l+1), curr:'coins'}, 
            hp: {cost: l=>5+l*2, curr:'gems'},
            turbo: {cost: l=>20+(l*10), curr:'gems'}
        }[id];
        
        const lvl = Game.upgrades[id] || 0; const cost = upg.cost(lvl);
        if(Game.stats[upg.curr] >= cost) {
            Game.stats[upg.curr] -= cost; 
            if(!Game.upgrades[id]) Game.upgrades[id] = 0;
            Game.upgrades[id]++; 
            AudioSys.sfx.coin();
            Game.save();
            this.updateShop();
        }
    },
    
    // Customization Modals
    pendingColor: null,
    showBuyModal(colorObj) {
        if(Game.stats.gems < 5) {
             alert("Not enough gems!"); return; // Simple fallback
        }
        this.pendingColor = colorObj;
        const modal = document.getElementById('modal');
        document.getElementById('modal-text').innerText = `Unlock ${colorObj.name} for 5 Gems?`;
        document.getElementById('modal-preview').style.backgroundColor = '#' + colorObj.hex.toString(16).padStart(6, '0');
        modal.classList.remove('hidden');
    },
    confirmModal() {
        if(this.pendingColor) {
            Customize.unlockColor(this.pendingColor.hex);
        }
    },
    closeModal() {
        document.getElementById('modal').classList.add('hidden');
        this.pendingColor = null;
    }
};

window.onload = () => Game.init();
</script>
</body>
